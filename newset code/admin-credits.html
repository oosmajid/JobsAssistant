<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت اعتبار کاربران - هزارجاب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h1 {
            color: #007bff;
            text-align: center;
            margin-bottom: 25px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 0.9em;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .form-section {
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1em;
            color: #555;
        }
        .form-group input[type="tel"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            box-sizing: border-box;
            direction: ltr;
            text-align: left;
        }
        .btn {
            display: inline-block;
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-green {
            background-color: #28a745;
        }
        .btn-green:hover {
            background-color: #218838;
        }
        #results-container {
            display: none;
            margin-top: 20px;
        }
        .user-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #e9ecef;
        }
        .user-info p {
            margin: 5px 0;
            font-size: 1.1em;
        }
        .user-info span {
            font-weight: 600;
            color: #007bff;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9em;
            z-index: 1000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show {
            display: block;
            opacity: 1;
        }
        .toast.error {
            background-color: #dc3545;
        }
        .toast.success {
            background-color: #28a745;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="/admin" class="back-link">← بازگشت به پنل اصلی</a>
        <h1>🛠️ مدیریت اعتبار کاربران</h1>

        <div class="form-section">
            <div class="form-group">
                <label for="phone-input">۱. شماره موبایل کاربر را وارد کنید (مثل: 09121234567)</label>
                <input type="tel" id="phone-input" placeholder="09121234567">
            </div>
            <button class="btn" id="search-btn">جستجو</button>
        </div>

        <div id="results-container">
            <div class="user-info">
                <p>کاربر: <span id="user-name">-</span></p>
                <p>شماره: <span id="user-phone">-</span></p>
                <hr>
                <p>اعتبار پیام فعلی: <span id="current-messages">-</span></p>
                <p>اشتراک تا: <span id="current-subscription">-</span></p>
            </div>

            <div class="form-section">
                <input type="hidden" id="hidden-user-id">
                <div class="form-group">
                    <label for="new-messages">۲. تنظیم اعتبار پیام (رایگان)</label>
                    <input type="number" id="new-messages" placeholder="مثلاً: 20 (برای تنظیم 20 پیام)">
                    <small style="color: #666;">اگر نمی‌خواهید تغییر کند، خالی بگذارید.</small>
                </div>
                <div class="form-group">
                    <label for="add-days">۳. افزودن اشتراک (روز)</label>
                    <input type="number" id="add-days" placeholder="مثلاً: 3 (برای افزودن ۳ روز) یا -1 (برای کسر ۱ روز)">
                    <small style="color: #666;">به تاریخ انقضای فعلی (یا به امروز) اضافه می‌شود. خالی بگذارید اگر نمی‌خواهید.</small>
                </div>
                <button class="btn btn-green" id="save-btn">ذخیره تغییرات اعتبار</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">پیام</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchBtn = document.getElementById('search-btn');
            const saveBtn = document.getElementById('save-btn');
            const phoneInput = document.getElementById('phone-input');
            const resultsContainer = document.getElementById('results-container');
            
            const userNameEl = document.getElementById('user-name');
            const userPhoneEl = document.getElementById('user-phone');
            const currentMessagesEl = document.getElementById('current-messages');
            const currentSubscriptionEl = document.getElementById('current-subscription');
            
            const newMessagesInput = document.getElementById('new-messages');
            const addDaysInput = document.getElementById('add-days');
            const hiddenUserIdInput = document.getElementById('hidden-user-id');
            const toast = document.getElementById('toast');

            let searchInProgress = false;
            let saveInProgress = false;

            // --- تابع نمایش Toast ---
            function showToast(message, type = 'success') {
                toast.textContent = message;
                toast.className = `toast show ${type}`;
                setTimeout(() => {
                    toast.className = 'toast';
                }, 3000);
            }

            // --- تابع جستجوی کاربر ---
            async function searchUser() {
                if (searchInProgress) return;
                searchInProgress = true;
                searchBtn.disabled = true;
                searchBtn.textContent = 'در حال جستجو...';
                resultsContainer.style.display = 'none';

                const phone = phoneInput.value;
                if (!phone) {
                    showToast('شماره موبایل را وارد کنید', 'error');
                    searchInProgress = false;
                    searchBtn.disabled = false;
                    searchBtn.textContent = 'جستجو';
                    return;
                }

                try {
                    const response = await fetch('/admin/get-user-credits', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone_number: phone })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'خطا در ارتباط با سرور');
                    }

                    // پر کردن اطلاعات
                    hiddenUserIdInput.value = data.user_id;
                    userNameEl.textContent = data.first_name || '(بدون نام)';
                    userPhoneEl.textContent = data.phone_number;
                    currentMessagesEl.textContent = data.message_credits;
                    
                    if (data.subscription_expires_at) {
                        const date = new Date(data.subscription_expires_at);
                        currentSubscriptionEl.textContent = date.toLocaleString('fa-IR');
                    } else {
                        currentSubscriptionEl.textContent = 'ندارد';
                    }
                    
                    // پاک کردن فیلدهای ورودی
                    newMessagesInput.value = '';
                    addDaysInput.value = '';
                    
                    resultsContainer.style.display = 'block';

                } catch (error) {
                    showToast(`خطا: ${error.message}`, 'error');
                } finally {
                    searchInProgress = false;
                    searchBtn.disabled = false;
                    searchBtn.textContent = 'جستجو';
                }
            }

            // --- تابع ذخیره تغییرات ---
            async function saveCredits() {
                if (saveInProgress) return;
                saveInProgress = true;
                saveBtn.disabled = true;
                saveBtn.textContent = 'در حال ذخیره...';
                
                const userId = hiddenUserIdInput.value;
                const newMessages = newMessagesInput.value;
                const addDays = addDaysInput.value;

                if (!userId) {
                    showToast('خطای داخلی: user_id یافت نشد', 'error');
                    return;
                }
                
                if (newMessages === '' && addDays === '') {
                    showToast('حداقل یک فیلد (پیام یا روز) باید پر شود', 'error');
                    saveInProgress = false;
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'ذخیره تغییرات اعتبار';
                    return;
                }

                try {
                    const payload = {
                        user_id: parseInt(userId),
                        new_messages: newMessages !== '' ? parseInt(newMessages) : null,
                        add_days: addDays !== '' ? parseInt(addDays) : null,
                    };

                    const response = await fetch('/admin/set-user-credits', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'خطا در ذخیره‌سازی');
                    }

                    showToast('اعتبار با موفقیت به‌روزرسانی شد', 'success');
                    // رفرش کردن اطلاعات نمایش داده شده
                    await searchUser();

                } catch (error) {
                    showToast(`خطا: ${error.message}`, 'error');
                } finally {
                    saveInProgress = false;
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'ذخیره تغییرات اعتبار';
                }
            }

            // --- Event Listeners ---
            searchBtn.addEventListener('click', searchUser);
            saveBtn.addEventListener('click', saveCredits);
            phoneInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    searchUser();
                }
            });
        });
    </script>
</body>
</html>
