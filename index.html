<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاور شغلی هزارجاب</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Dark mode styles */
        body.dark-mode {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        
        body.dark-mode .chat-header {
            background-color: #2d2d2d;
            color: #ffffff;
            border-bottom-color: #404040;
        }
        
        body.dark-mode .chat-messages {
            background-color: #1a1a1a;
        }
        
        body.dark-mode .chat-input {
            background-color: #2d2d2d;
            border-top-color: #404040;
        }
        
        body.dark-mode #user-input {
            background-color: #404040;
            color: #ffffff;
            border-color: #555555;
        }
        
        body.dark-mode #user-input:focus {
            border-color: #007bff;
        }
        
        body.dark-mode .user-message {
            background-color: #007bff;
            color: white;
        }
        
        body.dark-mode .bot-message {
            background-color: #404040;
            color: #ffffff;
        }
        
        body.dark-mode .chat-input button {
            color: #ffffff;
        }
        
        body.dark-mode .chat-input button:hover {
            color: #cccccc;
        }
        
        body.dark-mode .chat-input button:disabled {
            color: #666666;
        }
        
        /* مخفی کردن اسکرول‌بار در همه مرورگرها */
        ::-webkit-scrollbar {
            display: none;
        }
        
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .chat-header {
            background-color: #fff;
            color: #333;
            padding: 15px 25px;
            font-size: 1.1em;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e9ecef;
            flex-shrink: 0;
        }
        
        .chat-header-content {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quick-test-button {
            background-color: #28a745;
            color: white;
            border: 1px solid #28a745;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            transition: all 0.2s;
            display: none;
        }

        .quick-test-button.show {
            display: block;
        }

        .quick-test-button:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }

        body.dark-mode .quick-test-button {
            background-color: #28a745;
            color: white;
            border-color: #28a745;
        }

        body.dark-mode .quick-test-button:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }

        .simulation-test-button {
            background-color: #ffc107;
            color: black;
            border: 1px solid #ffc107;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            transition: all 0.2s;
            display: none;
        }

        .simulation-test-button.show {
            display: block;
        }

        .simulation-test-button:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }

        body.dark-mode .simulation-test-button {
            background-color: #ffc107;
            color: black;
            border-color: #ffc107;
        }

        body.dark-mode .simulation-test-button:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }
        .new-chat-button {
            background-color: #fff;
            color: #333;
            border: 1px solid #dee2e6;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            transition: all 0.2s;
        }
        .new-chat-button:hover { background-color: #f8f9fa; border-color: #ced4da; }
        
        .theme-toggle {
            background-color: #fff;
            color: #333;
            border: 1px solid #dee2e6;
            padding: 8px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }
        
        .theme-toggle:hover { 
            background-color: #f8f9fa; 
            border-color: #ced4da; 
        }
        
        body.dark-mode .theme-toggle {
            background-color: #404040;
            color: #ffffff;
            border-color: #555555;
        }
        
        body.dark-mode         .theme-toggle:hover {
            background-color: #555555;
        }
        
        .share-button {
            background-color: #fff;
            color: #333;
            border: 1px solid #dee2e6;
            padding: 8px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }
        
        .share-button:hover { 
            background-color: #f8f9fa; 
            border-color: #ced4da; 
        }
        
        body.dark-mode .share-button {
            background-color: #404040;
            color: #ffffff;
            border-color: #555555;
        }
        
        body.dark-mode .share-button:hover {
            background-color: #555555;
        }
        
        body.dark-mode .new-chat-button {
            background-color: #404040;
            color: #ffffff;
            border-color: #555555;
        }
        
        body.dark-mode .new-chat-button:hover {
            background-color: #555555;
            border-color: #666666;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .message-row {
            display: flex;
            align-items: flex-end;
            margin-bottom: 20px;
            gap: 10px;
        }
        .user-row { justify-content: flex-start; }
        .bot-row { justify-content: flex-end; }
        
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #f1f3f5;
            color: #868e96;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            flex-shrink: 0;
        }

        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
        }
        .user-message { background-color: #007bff; color: white; border-bottom-right-radius: 5px; }
        .bot-message { background-color: #fff; color: #333; border: 1px solid #e9ecef; border-bottom-left-radius: 5px; }
        .copy-icon { color: #adb5bd; cursor: pointer; font-size: 0.9em; padding: 5px; opacity: 0; transition: opacity 0.2s, color 0.2s; }
        .message-row:hover .copy-icon { opacity: 1; }
        .copy-icon:hover { color: #343a40; }
        .copy-icon .fa-check { color: #28a745; }
        .typing-indicator { padding: 12px 15px; }
        .typing-indicator span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #aaa; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        .chat-input { border-top: 1px solid #e9ecef; background-color: #fff; padding: 15px 25px; }
        
        .chat-input-content {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 0 20px;
            box-sizing: border-box;
        }
        #user-input {
            flex-grow: 1;
            padding: 12px 18px;
            border: 1px solid #dee2e6;
            border-radius: 25px;
            font-size: 1em;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            resize: none;
            line-height: 1.5;
            min-height: 24px; 
            height: 24px;
            max-height: calc(1.5em * 5 + 24px);
            overflow: hidden; 
        }
        #user-input:focus { outline: none; border-color: #a6cffb; }
        .chat-input .input-buttons { display: flex; align-items: center; gap: 5px; }
        .chat-input button { background-color: transparent; color: #6c757d; border: none; padding: 10px; border-radius: 50%; cursor: pointer; font-size: 1.6em; line-height: 1; transition: all 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .chat-input button:hover { color: #343a40; }
        .chat-input button:disabled { color: #ced4da; }
        #user-input:disabled { background-color: #e9ecef; }
        @keyframes pulse-shadow { 0%, 100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); } 50% { box-shadow: 0 0 0 8px rgba(220, 53, 69, 0); } }
        @keyframes pulse-icon { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .mic-button.recording { color: #dc3545; animation: pulse-shadow 1.5s infinite; }
        .mic-button.recording i { animation: pulse-icon 1.5s infinite ease-in-out; }
        .speech-status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 0, 0, 0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.9em; z-index: 1000; display: none; }
        
        /* مودال اشتراک‌گذاری */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease-out;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .modal-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin: 0;
        }
        
        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .close:hover {
            color: #000;
        }
        
        .modal-body {
            margin-bottom: 20px;
        }
        
        .share-link-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .share-link-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            font-size: 0.9em;
            background-color: #f8f9fa;
            color: #333;
        }
        
        .copy-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        
        .copy-button:hover {
            background-color: #0056b3;
        }
        
        .copy-button.copied {
            background-color: #28a745;
        }
        
        .share-warning {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85em;
            margin-top: 15px;
        }
        
        /* حالت تاریک برای مودال */
        body.dark-mode .modal-content {
            background-color: #2d2d2d;
            color: #ffffff;
        }
        
        body.dark-mode .modal-title {
            color: #ffffff;
        }
        
        body.dark-mode .close {
            color: #ccc;
        }
        
        body.dark-mode .close:hover {
            color: #ffffff;
        }
        
        body.dark-mode .share-link-input {
            background-color: #404040;
            color: #ffffff;
            border-color: #555555;
        }
        
        body.dark-mode .share-warning {
            background-color: #3d2914;
            border-color: #6c4a00;
            color: #ffc107;
        }
        

        /* --- استایل‌های جدید برای مودال لاگین --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none; /* اول مخفی است */
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .login-modal {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
            animation: modalSlideIn 0.3s ease-out;
        }
        
        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-modal h3 {
            margin-top: 0;
            margin-bottom: 1rem;
            color: #333;
        }
        
        .login-modal p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 1.5rem;
        }

        .login-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1em;
            text-align: left; /* برای شماره موبایل و کد بهتر است */
            direction: ltr;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        
        .login-input::placeholder {
            text-align: right;
            direction: rtl;
        }

        .login-button-primary {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
        }
        
        .login-button-primary:hover {
            background-color: #0056b3;
        }
        
        .login-button-primary:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
        
        .login-modal-close {
            position: absolute;
            top: 15px;
            left: 20px; /* چون مودال فارسی است، دکمه بستن را سمت چپ می‌گذاریم */
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #aaa;
            cursor: pointer;
        }
        .login-modal-close:hover { color: #333; }
        
        .login-error {
            color: #dc3545;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            margin-bottom: 1rem;
            display: none; /* در ابتدا مخفی */
        }
        
        #otp-step {
            display: none; /* مرحله دوم در ابتدا مخفی */
        }
        
        /* حالت تاریک برای مودال */
        body.dark-mode .login-modal {
            background: #2d2d2d;
        }
        body.dark-mode .login-modal h3 { color: #eee; }
        body.dark-mode .login-modal p { color: #bbb; }
        body.dark-mode .login-input {
            background: #404040;
            color: #fff;
            border-color: #555;
        }
        body.dark-mode .login-modal-close { color: #888; }
        body.dark-mode .login-modal-close:hover { color: #fff; }
        /* --- پایان استایل‌های مودال --- */

        /* Mobile Responsive Design */
        @media (max-width: 768px) {
            body {
                margin: 0;
                padding: 0;
                overflow-x: hidden;
                height: 100vh;
                height: 100dvh; /* Dynamic viewport height for mobile */
                width: 100vw;
                width: 100dvw; /* Dynamic viewport width for mobile */
            }
            
            .chat-header {
                padding: 10px 0;
                font-size: 1em;
            }
            
            .chat-header-content {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
                padding: 0 15px;
            }
            
            .header-right {
                justify-content: space-between;
                flex-wrap: nowrap;
                width: 100%;
            }
            
            .new-chat-button, .quick-test-button, .simulation-test-button {
                order: 1;
                flex: 1;
                min-width: 120px;
                padding: 8px 16px;
                border-radius: 8px;
                font-size: 0.9em;
                text-align: center;
            }

            .theme-toggle, .share-button {
                order: 2;
                width: 36px;
                height: 36px;
                padding: 8px;
                border-radius: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .chat-messages {
                padding: 15px;
                margin: 0;
                height: calc(100vh - 140px);
                height: calc(100dvh - 140px);
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
            }
            
            .message {
                max-width: 85%;
                padding: 10px 15px;
                font-size: 0.95em;
            }
            
            .chat-input {
                padding: 10px 0;
                margin: 0;
                width: 100%;
            }
            
            .chat-input-content {
                gap: 8px;
                width: 100%;
                padding: 0 15px;
            }
            
            #user-input {
                font-size: 16px; /* Prevent zoom on iOS */
                padding: 10px 15px;
            }
            
            .chat-input button {
                padding: 8px;
                font-size: 1.4em;
            }
            
            .modal-content {
                margin: 10% auto;
                padding: 20px;
                width: 95%;
            }
            
            .share-link-container {
                flex-direction: column;
                gap: 10px;
            }
            
            .copy-button {
                width: 100%;
            }
            
            /* Hide bot avatar on mobile */
            .bot-row .avatar {
                display: none;
            }
        }
        
        @media (max-width: 480px) {
            body {
                margin: 0;
                padding: 0;
                overflow-x: hidden;
                height: 100vh;
                height: 100dvh;
                width: 100vw;
                width: 100dvw;
            }
            
            .chat-header {
                padding: 8px 0;
            }
            
            .chat-header-content {
                padding: 0 10px;
            }
            
            .new-chat-button, .quick-test-button, .simulation-test-button {
                min-width: 100px;
                padding: 6px 12px;
                border-radius: 8px;
                font-size: 0.8em;
                text-align: center;
            }
            
            .theme-toggle, .share-button {
                width: 32px;
                height: 32px;
                padding: 6px;
            }
            
            .chat-messages {
                padding: 10px;
                margin: 0;
                height: calc(100vh - 120px);
                height: calc(100dvh - 120px);
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
            }
            
            .message {
                max-width: 90%;
                padding: 8px 12px;
                font-size: 0.9em;
            }
            
            .avatar {
                width: 28px;
                height: 28px;
                font-size: 0.9em;
            }
            
            .chat-input {
                padding: 8px 0;
                margin: 0;
                width: 100%;
            }
            
            .chat-input-content {
                padding: 0 10px;
            }
            
            #user-input {
                padding: 8px 12px;
                font-size: 15px;
            }
            
            .modal-content {
                margin: 5% auto;
                padding: 15px;
            }
            
            .modal-title {
                font-size: 1.1em;
            }
            
            /* Hide bot avatar on small mobile */
            .bot-row .avatar {
                display: none;
            }
        }

        /* --- استایل برای جدول‌های Markdown --- */
        .bot-message table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            background-color: #ffffff;
            font-size: 0.9em;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e9ecef;
        }
        .bot-message th, .bot-message td {
            border: 1px solid #e9ecef;
            padding: 10px 12px;
            text-align: right;
        }
        .bot-message th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        /* --- استایل جدول در حالت تاریک --- */
        body.dark-mode .bot-message table {
            background-color: #2d2d2d;

<body>

    <script>
        // Configuration
        // برای تغییر URL سرور، این متغیرها را تغییر دهید:
        // مثال: const API_BASE_URL = 'https://your-domain.com';
        // یا: const API_BASE_URL = 'http://localhost:5000';
        const API_BASE_URL = window.location.origin; // استفاده از همان دامنه فعلی
        const CHAT_API_ENDPOINT = `${API_BASE_URL}/chat`;
        const SHARE_API_ENDPOINT = `${API_BASE_URL}/share-chat`;
        // *** حذف شد: دیگر نیازی به این اندپوینت نیست ***
        // const ANALYSIS_API_ENDPOINT = `${API_BASE_URL}/start-analysis`;

        marked.setOptions({
            breaks: true, // هر اینتر را به <br> تبدیل می‌کند
            gfm: true     // Markdown پیشرفته گیت‌هاب (برای جدول، خط خورده و غیره) را فعال می‌کند
        });
        // DOM Elements
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const newChatButton = document.getElementById('new-chat-button');
        const micButton = document.getElementById('mic-button');
        const speechStatus = document.getElementById('speech-status');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const shareButton = document.getElementById('share-button');
        const shareModal = document.getElementById('share-modal');
        const closeShareModal = document.getElementById('close-share-modal');
        const shareLinkInput = document.getElementById('share-link-input');
        const copyShareLink = document.getElementById('copy-share-link');
        const quickTestButton = document.getElementById('quick-test-button');
        const simulationTestButton = document.getElementById('simulation-test-button');
        // --- المان‌های جدید برای لاگین ---
        const loginButton = document.getElementById('login-button');
        const logoutButton = document.getElementById('logout-button');
        const loginModalOverlay = document.getElementById('login-modal-overlay');
        const loginModalCloseBtn = document.getElementById('login-modal-close-btn');
        
        const phoneStep = document.getElementById('phone-step');
        const otpStep = document.getElementById('otp-step');
        
        const phoneInput = document.getElementById('phone-input');
        const sendOtpBtn = document.getElementById('send-otp-btn');
        const changePhoneBtn = document.getElementById('change-phone-btn');
        
        const otpInput = document.getElementById('otp-input');
        const verifyOtpBtn = document.getElementById('verify-otp-btn');
        const userPhoneDisplay = document.getElementById('user-phone-display');
        
        const loginErrorPhone = document.getElementById('login-error-phone');
        const loginErrorOtp = document.getElementById('login-error-otp');
        // --- پایان المان‌های لاگین ---
        
        // شناسه کاربر ناشناس (مهمان)
        let anonymous_user_id = localStorage.getItem('anonymous_user_id') || 'web_user_' + Date.now() + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('anonymous_user_id', anonymous_user_id);
        
        let authToken = localStorage.getItem('authToken'); // توکن کاربر لاگین شده
        let pendingLoginGate = (localStorage.getItem('pendingLoginGate') === '1'); // فلگ ادامه پس از لاگین
        let userCareerProfile = null; // پروفایل شغلی (بدون تغییر)
        
        // متغیرهای مربوط به چت فعلی
        let currentConversationId = null; // <<< (جدید) ID چت فعلی را نگه می‌داریم
        
        let recognition = null;
        let isRecording = false;
        let finalTranscript = ''; // ذخیره تمام متن نهایی تایید شده
        let isQuickTestMode = false; // برای غیرفعال کردن انیمیشن تایپ در تست سریع
        let silenceTimeout = null; // برای مدیریت سکوت
        let restartAttempts = 0; // شمارنده تلاش برای restart
        
        // متغیرهای مربوط به تایپ در پس‌زمینه
        let currentTypingInterval = null;
        let typingStartTime = null;
        let typingSpeed = 3; // میلی‌ثانیه بین هر کاراکتر (سرعت بالا)
        let currentTypingData = null;
        
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'fa-IR';
            
            recognition.onstart = () => { isRecording = true; micButton.classList.add('recording'); };
            
            recognition.onresult = (event) => {
                // پاک کردن timeout سکوت قبلی
                if (silenceTimeout) {
                    clearTimeout(silenceTimeout);
                }
                
                let interimTranscript = '';

                // پردازش نتایج از resultIndex تا آخر
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript;

                    if (event.results[i].isFinal) {
                        // اگر نتیجه نهایی است، به finalTranscript اضافه کن
                        finalTranscript += transcript;
                        // ریست کردن شمارنده restart
                        restartAttempts = 0;
                    } else {
                        // اگر نتیجه موقت است، به interimTranscript اضافه کن
                        interimTranscript += transcript;
                    }
                }

                // نمایش متن نهایی + متن موقت در input
                userInput.value = finalTranscript + interimTranscript;
                userInput.dispatchEvent(new Event('input'));
                
                // تنظیم timeout برای تشخیص سکوت (5 ثانیه)
                silenceTimeout = setTimeout(() => {
                    if (isRecording && restartAttempts < 3) {
                        console.log('Silence detected, restarting recognition...');
                        try {
                            recognition.stop();
                            setTimeout(() => {
                                recognition.start();
                                restartAttempts++;
                            }, 200);
                        } catch (e) {
                            console.error('Failed to restart recognition after silence:', e);
                        }
                    }
                }, 5000);
            };
            
            recognition.onerror = (event) => { 
                console.error('Speech recognition error:', event.error); 
                
                // پاک کردن timeout سکوت در صورت خطا
                if (silenceTimeout) {
                    clearTimeout(silenceTimeout);
                    silenceTimeout = null;
                }
                
                // فقط در صورت خطای جدی ضبط را متوقف کن
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    isRecording = false; 
                    micButton.classList.remove('recording');
                    restartAttempts = 0;
                } else if (event.error === 'network' || event.error === 'service-unavailable') {
                    // در صورت خطای شبکه، تلاش برای restart
                    if (isRecording && restartAttempts < 2) {
                        console.log('Network error, attempting to restart recognition...');
                        setTimeout(() => {
                            try {
                                recognition.start();
                                restartAttempts++;
                            } catch (e) {
                                console.error('Failed to restart recognition after network error:', e);
                                isRecording = false;
                                micButton.classList.remove('recording');
                                restartAttempts = 0;
                            }
                        }, 1000);
                    } else {
                        // اگر تلاش‌ها تمام شد، ضبط را متوقف کن
                        isRecording = false;
                        micButton.classList.remove('recording');
                        restartAttempts = 0;
                    }
                } else if (event.error === 'no-speech' || event.error === 'audio-capture') {
                    // برای خطاهای صوتی، تلاش برای restart
                    if (isRecording && restartAttempts < 1) {
                        console.log('Audio error, attempting to restart recognition...');
                        setTimeout(() => {
                            try {
                                recognition.start();
                                restartAttempts++;
                            } catch (e) {
                                console.error('Failed to restart recognition after audio error:', e);
                                isRecording = false;
                                micButton.classList.remove('recording');
                                restartAttempts = 0;
                            }
                        }, 500);
                    }
                }
            };
            
            recognition.onend = () => { 
                console.log('Speech recognition ended, isRecording:', isRecording);
                // ضبط خودکار متوقف نمی‌شود - فقط در صورت کلیک کاربر یا ارسال پیام
                if (isRecording && restartAttempts < 3) {
                    // تاخیر کوتاه قبل از restart برای جلوگیری از تداخل
                    setTimeout(() => {
                        try {
                            console.log('Restarting speech recognition...');
                            recognition.start();
                            restartAttempts++;
                        } catch (e) {
                            console.error('Failed to restart recognition in onend:', e);
                            // اگر restart موفق نبود، ضبط را متوقف کن
                            isRecording = false;
                            micButton.classList.remove('recording');
                            restartAttempts = 0;
                        }
                    }, 100);
                } else if (restartAttempts >= 3) {
                    // اگر تعداد تلاش‌ها زیاد شد، ضبط را متوقف کن
                    console.log('Too many restart attempts, stopping recognition');
                    isRecording = false;
                    micButton.classList.remove('recording');
                    restartAttempts = 0;
                }
            };
        } else { micButton.style.display = 'none'; }

        function createCopyIcon(textToCopy) {
            const iconContainer = document.createElement('div');
            iconContainer.classList.add('copy-icon');
            iconContainer.innerHTML = '<i class="far fa-copy"></i>';
            iconContainer.addEventListener('click', () => { navigator.clipboard.writeText(textToCopy).then(() => { iconContainer.innerHTML = '<i class="fas fa-check"></i>'; setTimeout(() => { iconContainer.innerHTML = '<i class="far fa-copy"></i>'; }, 1500); }).catch(err => { console.error('Failed to copy text: ', err); }); });
            return iconContainer;
        }

        function addMessage(text, sender) {
            const messageRow = document.createElement('div');
            messageRow.classList.add('message-row', sender === 'user' ? 'user-row' : 'bot-row');
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
            
            // ذخیره متن خام در data attribute
            messageElement.setAttribute('data-raw-text', text);
            
            if (sender === 'user') {
                const sanitizedText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                messageElement.innerHTML = sanitizedText.replace(/\n/g, '<br>');
            } else {
                // برای پیام‌های ربات، markdown را رندر کن
                messageElement.innerHTML = marked.parse(text);
            }
            
            const copyIcon = createCopyIcon(text);

            if (sender === 'user') {
                messageRow.appendChild(messageElement);
                messageRow.appendChild(copyIcon);
            } else { // Bot
                const avatar = document.createElement('div');
                avatar.classList.add('avatar');
                avatar.innerHTML = '<i class="fa-solid fa-robot"></i>';
                // تغییر ۱: تغییر ترتیب برای جابجایی آیکون کپی
                messageRow.appendChild(copyIcon);
                messageRow.appendChild(messageElement);
                messageRow.appendChild(avatar);
            }
            chatMessages.appendChild(messageRow);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function addTypedMessage(text, sender) {
            const messageRow = document.createElement('div');
            messageRow.classList.add('message-row', sender === 'user' ? 'user-row' : 'bot-row');
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
            
            // ذخیره متن خام در data attribute
            messageElement.setAttribute('data-raw-text', text);
            
            const copyIcon = createCopyIcon(text);

            if (sender === 'bot') {
                const avatar = document.createElement('div');
                avatar.classList.add('avatar');
                avatar.innerHTML = '<i class="fa-solid fa-robot"></i>';
                // تغییر ۱: تغییر ترتیب برای جابجایی آیکون کپی
                messageRow.appendChild(copyIcon);
                messageRow.appendChild(messageElement);
                messageRow.appendChild(avatar);
            }

            chatMessages.appendChild(messageRow);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            // اگر در حالت تست سریع هستیم، بدون انیمیشن نمایش بده
            if (isQuickTestMode) {
                messageElement.innerHTML = marked.parse(text);
            } else {
                // شروع تایپ
                startTypingAnimation(messageElement, text);
            }
        }
        
        function startTypingAnimation(messageElement, text) {
            let index = 0;
            const originalText = text; // حفظ متن اصلی برای markdown
            typingStartTime = Date.now();
            
            // ذخیره اطلاعات تایپ فعلی
            currentTypingData = {
                messageElement: messageElement,
                text: originalText,
                index: index,
                startTime: typingStartTime
            };
            
            const typingInterval = setInterval(() => {
                if (index < originalText.length) {
                    // دریافت متن فعلی تا این نقطه
                    const currentText = originalText.substring(0, index + 1);
                    
                    // اعمال markdown به متن فعلی
                    messageElement.innerHTML = marked.parse(currentText);
                    
                    index++;
                    currentTypingData.index = index;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                } else {
                    clearInterval(typingInterval);
                    currentTypingInterval = null;
                    currentTypingData = null;
                    // اعمال نهایی markdown (برای اطمینان)
                    messageElement.innerHTML = marked.parse(originalText);
                }
            }, typingSpeed);
            
            currentTypingInterval = typingInterval;
        }
        
        function resumeTypingIfNeeded() {
            if (!currentTypingData || !currentTypingInterval) return;
            
            const elapsed = Date.now() - currentTypingData.startTime;
            const expectedIndex = Math.floor(elapsed / typingSpeed);
            
            if (expectedIndex > currentTypingData.index) {
                // تایپ در پس‌زمینه ادامه پیدا کرده
                const skipCount = expectedIndex - currentTypingData.index;
                currentTypingData.index += skipCount;
                
                if (currentTypingData.index >= currentTypingData.text.length) {
                    // تایپ تمام شده
                    clearInterval(currentTypingInterval);
                    // اعمال نهایی markdown
                    currentTypingData.messageElement.innerHTML = marked.parse(currentTypingData.text);
                    currentTypingInterval = null;
                    currentTypingData = null;
                } else {
                    // دریافت متن فعلی تا این نقطه و اعمال markdown
                    const currentText = currentTypingData.text.substring(0, currentTypingData.index);
                    currentTypingData.messageElement.innerHTML = marked.parse(currentText);
                }
            }
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTypingIndicator() {
            const messageRow = document.createElement('div');
            messageRow.id = 'typing-indicator-row';
            messageRow.classList.add('message-row', 'bot-row');
            const avatar = document.createElement('div');
            avatar.classList.add('avatar');
            avatar.innerHTML = '<i class="fa-solid fa-robot"></i>';
            const indicator = document.createElement('div');
            indicator.classList.add('message', 'bot-message', 'typing-indicator');
            indicator.innerHTML = '<span></span><span></span><span></span>';
            messageRow.appendChild(indicator);
            messageRow.appendChild(avatar);
            chatMessages.appendChild(messageRow);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showUserTypingIndicator() {
            const messageRow = document.createElement('div');
            messageRow.id = 'user-typing-indicator-row';
            messageRow.classList.add('message-row', 'user-row');
            const indicator = document.createElement('div');
            indicator.classList.add('message', 'user-message', 'typing-indicator');
            indicator.innerHTML = '<span></span><span></span><span></span>';
            messageRow.appendChild(indicator);
            chatMessages.appendChild(messageRow);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTypingIndicator() { const indicatorRow = document.getElementById('typing-indicator-row'); if (indicatorRow) indicatorRow.remove(); }
        
        function removeUserTypingIndicator() { 
            const indicatorRow = document.getElementById('user-typing-indicator-row'); 
            if (indicatorRow) indicatorRow.remove(); 
        }
        function startNewChat(isReloadingAfterLogin = false) {
            chatMessages.innerHTML = '';
            currentConversationId = null; // ریست کردن شناسه چت
            finalTranscript = '';
            
            // --- FIX: پاک کردن پیام معلق ---
            localStorage.removeItem('pendingLoginGate');
            localStorage.removeItem('pendingUserMessage');
            // --- End FIX ---

            // اگر کاربر لاگین نکرده، یک شناسه ناشناس جدید بساز
            if (!authToken) {
                anonymous_user_id = 'web_user_' + Date.now() + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('anonymous_user_id', anonymous_user_id);
            } else {
                anonymous_user_id = null;
            }

            // اگر بعد از لاگین در حال بارگذاری هستیم، پیام خوش‌آمدگویی را نشان نده
            // (چون تابع sendMessage خودش چت‌های قبلی را بارگذاری می‌کند)
            if (!isReloadingAfterLogin) {
                showTypingIndicator();
                setTimeout(() => { 
                    removeTypingIndicator(); 
                    addTypedMessage('سلام! من مشاور شغلی «هزارجاب» هستم. برای اینکه بتونم بهتر کمکت کنم، لطفاً خودت رو کامل معرفی کن: نام، سن، جنسیت، وضعیت شغلی فعلی و رشتهٔ تحصیلی.', 'bot'); 
                }, 1000);
            } else {
                // اگر بعد از لاگین است، اولین پیام خالی را بفرست تا تاریخچه را بگیرد
                // (این یک ترفند است، می‌توان آن را بهتر هم پیاده کرد)
                // فعلاً این کار را نمی‌کنیم، اجازه می‌دهیم کاربر خودش پیام دهد
                // یا می‌توانیم تابع /api/get-my-chats را فراخوانی کنیم
                addMessage('✅ با موفقیت وارد شدید. مکالمات قبلی شما (در صورت وجود) بارگذاری شد.', 'bot');
                // TODO: بارگذاری چت‌های قبلی از /api/get-my-chats
            }
        }
        function toggleSpeechRecognition() {
            if (!recognition || sendButton.disabled) return;
            if (isRecording) {
                // توقف ضبط صدا
                recognition.stop();
                isRecording = false;
                micButton.classList.remove('recording');
                // پاک کردن timeout سکوت و ریست کردن شمارنده
                if (silenceTimeout) {
                    clearTimeout(silenceTimeout);
                    silenceTimeout = null;
                }
                restartAttempts = 0;
            } else {
                // شروع ضبط صدا - حفظ متن موجود در تکست‌باکس
                finalTranscript = userInput.value;
                restartAttempts = 0; // ریست کردن شمارنده restart
                try {
                    recognition.start();
                } catch (e) {
                    console.error('Failed to start recognition:', e);
                    isRecording = false;
                    micButton.classList.remove('recording');
                }
            }
        }

        async function generateShareLink() {
            try {
                // (جدید) هدرها و بدنه‌ی داینامیک بساز
                const headers = {
                    'Content-Type': 'application/json'
                };
                if (authToken) {
                    headers['Authorization'] = `Bearer ${authToken}`;
                }

                const body = {
                    conversation: getCurrentConversation(),
                    career_profile: userCareerProfile,
                    anonymous_user_id: anonymous_user_id // این را همیشه بفرست
                };

                const response = await fetch(SHARE_API_ENDPOINT, {
                    method: 'POST',
                    headers: headers, // (جدید)
                    body: JSON.stringify(body) // (جدید)
                });
                
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || 'خطا در تولید لینک');
                }
                
                const data = await response.json();
                const shareUrl = `${window.location.origin}/shared/${data.share_id}`;
                shareLinkInput.value = shareUrl;
                return shareUrl;

            } catch (error) {
                console.error('Error generating share link:', error);
                shareLinkInput.value = error.message; // نمایش خطای واقعی
                return null;
            }
        }
        
        function getCurrentConversation() {
            const messages = [];
            const messageRows = chatMessages.querySelectorAll('.message-row');
            
            messageRows.forEach(row => {
                const messageElement = row.querySelector('.message');
                if (messageElement && !row.id.includes('typing-indicator')) {
                    const isUser = row.classList.contains('user-row');
                    
                    // دریافت متن خام از data attribute
                    let text = messageElement.getAttribute('data-raw-text');
                    
                    // fallback: اگر data attribute نداشت، از textContent استفاده کن
                    if (!text) {
                        text = messageElement.textContent.trim();
                    }
                    
                    if (text) {
                        messages.push({
                            role: isUser ? 'user' : 'model',
                            parts: [text]
                        })
                    }
                }
            });
            
            return messages;
        }

                        code: code,
                        anonymous_user_id: anonymous_user_id // مهم: شناسه چت مهمان را می‌فرستیم
                    })

                if (!response.ok) {

                await loadAndDisplayHistory(); // پس از ورود، تاریخچه چت کاربر را نمایش بده

        // --- پایان توابع لاگین ---

        // (جدید) تابعی برای بارگذاری تاریخچه چت کاربر
        async function loadAndDisplayHistory() {
            // فقط اگر کاربر لاگین است اجرا شود
            if (!authToken) return;

            addMessage('در حال بارگذاری مکالمات قبلی شما...', 'bot');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/get-my-chats`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error('خطا در دریافت تاریخچه چت.');
                }

                const chats = await response.json();
                
                // پاک کردن پیام "در حال بارگذاری"
                chatMessages.innerHTML = ''; 

                if (chats && chats.length > 0) {
                    // جدیدترین چت را بارگذاری کن (اولین آیتم در لیست)
                    const latestChat = chats[0];
                    currentConversationId = latestChat.id; // <--- مهم
                    userCareerProfile = latestChat.career_profile;
                    const history = latestChat.conversation_history || [];
                    if (history.length > 0) {
                        history.forEach(msg => {
                            const text = (Array.isArray(msg.parts) ? msg.parts.join(' ') : msg.parts);
                            addMessage(text, msg.role === 'model' ? 'bot' : 'user');
                        });
                        // چک کن آیا آخرین پیام مدل، خلاصه تاییدی ۴.۳ یا گیت لاگین است
                        function lastBotMsgText(hist) {
                            for (let i = hist.length - 1; i >= 0; --i) {
                                if (hist[i].role === 'model') {
                                    return (Array.isArray(hist[i].parts) ? hist[i].parts.join(' ') : hist[i].parts).trim();
                                }
                            }
                            return '';
                        }
                        const lastText = lastBotMsgText(history);
                        const isSummaryConfirm = lastText.includes('تصویر درستی ازت پیدا کردم') || lastText.includes('آیا این تصویر رو تایید می‌کنی') || lastText.includes('بر اساس حرف‌هات، من آدمی رو می‌بینم که');
                        const isLoginGate = lastText.includes('برای مشاهده پیشنهادهای شغلی و تحلیل نهایی، لطفاً وارد شو') || lastText.includes('تحلیلت آماده‌ست. 🚀');
                        if (!isSummaryConfirm && !isLoginGate) {
                            addMessage('سلام! خوش برگشتی. مکالمه قبلی شما بارگذاری شد. می‌تونی ادامه بدی.', 'bot');
                        }
                        
                    } else {
                        addTypedMessage('سلام! خوش برگشتی. می‌خوای یک موضوع جدید رو شروع کنیم؟', 'bot');
                    }
                } else {
                    // کاربر لاگین است اما هیچ چتی ندارد
                    addTypedMessage('سلام! خوش برگشتی. برای اینکه بتونم بهتر کمکت کنم، لطفاً خودت رو کامل معرفی کن.', 'bot');
                }

            } catch (error) {
                console.error('Error loading history:', error);
                chatMessages.innerHTML = ''; // پاک کردن پیام لودینگ
                addMessage('خطا در بارگذاری تاریخچه. لطفاً صفحه را رفرش کنید.', 'bot');
            }
        }

        function getLastBotMessageText() {
            const rows = Array.from(chatMessages.querySelectorAll('.message-row.bot-row .message'));
            if (rows.length === 0) return '';
            const last = rows[rows.length - 1];
            const raw = last.getAttribute('data-raw-text') || last.textContent || '';
            return raw.trim();
        }

        function wasLoginGateShown(text) {
            if (!text) return false;
            // عبارت کلیدی گیت لاگین
            return text.includes('برای مشاهده پیشنهادهای شغلی و تحلیل نهایی، لطفاً وارد شو یا ثبت‌نام کن');
        }

        async function continueAfterLoginIfNeeded() {
            if (!authToken) return; // فقط وقتی لاگین است
            if (!pendingLoginGate) {
                // برای سازگاری عقب‌رو: اگر فلگ نبود ولی متن گیت بود، ادامه بده
                const lastTextFallback = getLastBotMessageText();
                if (!wasLoginGateShown(lastTextFallback)) return;
            }

            // --- FIX 2 (حل مشکل "ادامه بده") ---
            // پیام ذخیره شده را بخوان، اگر نبود از 'ادامه بده' به عنوان فال‌بک استفاده کن
            const pendingMessage = localStorage.getItem('pendingUserMessage') || 'ادامه بده';
            // --- End FIX 2 ---

            let conversation = getCurrentConversation();

            // چون تاریخچه بارگذاری شده شامل پیام تایید کاربر (pendingMessage) است،
            // ما آن را از تاریخی که به بک‌اند می‌فرستیم حذف می‌کنیم
            // تا بک‌اند (که انتظار دریافت آن را دارد) آن را دوباره اضافه کند و دوتایی نشود.
            if (conversation.length > 0 && 
                conversation[conversation.length - 1].role === 'user' &&
                conversation[conversation.length - 1].parts[0] === pendingMessage) {
                
                console.log("Popping last user message from history before sending to 'continueAfterLogin'");
                conversation.pop();
            }

            // درخواست ادامه پس از لاگین: بدون افزودن پیام کاربر به UI
            const headers = { 'Content-Type': 'application/json' };
            headers['Authorization'] = `Bearer ${authToken}`;
            const body = {
                message: pendingMessage,
                conversation: conversation,
                anonymous_user_id: null,
                conversation_id: currentConversationId,
                is_post_login_trigger: true
            };
            showTypingIndicator();
            try {
                const response = await fetch(CHAT_API_ENDPOINT, { method: 'POST', headers, body: JSON.stringify(body) });
                const data = await response.json();
                removeTypingIndicator();
                if (!response.ok) {
                    if (data.token_expired) {
                        addMessage('⚠️ نشست شما منقضی شده. لطفاً دوباره وارد شوید.', 'bot');
                        localStorage.removeItem('authToken');
                        authToken = null;
                        updateLoginButton();
                        openLoginModal();
                    }
                    return;
                }

                if (data.conversation_id) {
                    currentConversationId = data.conversation_id;
                }
                if (data.new_anonymous_user_id) {
                    anonymous_user_id = data.new_anonymous_user_id;
                    localStorage.setItem('anonymous_user_id', anonymous_user_id);
                }

                if (data.reply) {
                    addTypedMessage(data.reply, 'bot');
                }
                // --- FIX 2 (ادامه) ---
                // با موفقیت ادامه داده شد؛ فلگ‌ها را پاک کن
                pendingLoginGate = false;
                localStorage.removeItem('pendingLoginGate');
                localStorage.removeItem('pendingUserMessage'); // <-- پیام ذخیره شده را پاک کن
                // --- End FIX 2 ---
            } catch (e) {
                removeTypingIndicator();
                console.error('continueAfterLoginIfNeeded error:', e);
            }
        }

        async function sendMessage() {
            const messageText = userInput.value.trim();
            if (messageText === '' || sendButton.disabled) return;
            
            // ... (کدهای توقف ضبط صدا - بدون تغییر) ...
            if (isRecording && recognition) {
                recognition.stop();
                isRecording = false;
                micButton.classList.remove('recording');
                if (silenceTimeout) {
                    clearTimeout(silenceTimeout);
                    silenceTimeout = null;
                }
                restartAttempts = 0;
            }
            
            const conversation = getCurrentConversation();
            
            addMessage(messageText, 'user');

            userInput.value = '';
            finalTranscript = ''; 
            userInput.dispatchEvent(new Event('input'));
            sendButton.disabled = true; userInput.disabled = true; micButton.disabled = true;
            showTypingIndicator();

            try {
                // --- ساخت هدر و بدنه‌ی درخواست (جدید) ---
                const headers = { 'Content-Type': 'application/json' };
                if (authToken) {
                    headers['Authorization'] = `Bearer ${authToken}`;
                }
                
                const body = {
                    message: messageText,
                    conversation: conversation,
                    anonymous_user_id: anonymous_user_id, // شناسه مهمان
                    conversation_id: currentConversationId // <<< (این خط اضافه شد)
                };
                
                const response = await fetch(CHAT_API_ENDPOINT, { 
                    method: 'POST', 
                    headers: headers, 
                    body: JSON.stringify(body), 
                });
                // --- پایان تغییرات درخواست ---
                
                const data = await response.json();
                removeTypingIndicator();

                if (!response.ok) {
                    if (data.token_expired) {
                        // توکن منقضی شده
                        addMessage('⚠️ نشست شما منقضی شده. لطفاً دوباره وارد شوید.', 'bot');
                        localStorage.removeItem('authToken');
                        authToken = null;
                        updateLoginButton();
                        openLoginModal();
                    } else {
                        throw new Error(data.reply || data.error || `HTTP ${response.status}`);
                    }
                    return; // ادامه نده
                }

                

                // (جدید) شناسه چت و شناسه ناشناس را آپدیت کن
                if (data.conversation_id) {
                    currentConversationId = data.conversation_id;
                }
                if (data.new_anonymous_user_id) {
                    anonymous_user_id = data.new_anonymous_user_id;
                    localStorage.setItem('anonymous_user_id', anonymous_user_id);
                }
                
                // (جدید) بررسی سیگنال لاگین اجباری
                if (data.reply_type === 'login_required') {

                    // --- FIX 2 (شروع) ---
                    // پیامی که کاربر تایپ کرده بود را ذخیره کن تا پس از لاگین استفاده شود
                    localStorage.setItem('pendingUserMessage', messageText);
                    // --- End FIX 2 ---

                    pendingLoginGate = true;
                    localStorage.setItem('pendingLoginGate', '1');
                    addTypedMessage(data.reply, 'bot');
                    // باز کردن خودکار مودال لاگین
                    setTimeout(openLoginModal, 3500); 
                } else {
                    // پاسخ استاندارد
                    addTypedMessage(data.reply, 'bot');
                }
                
                if (data.career_profile) {
                    userCareerProfile = data.career_profile;
                }

            } catch (error) {
                console.error('Error in sendMessage:', error);
                removeTypingIndicator();
                if (error.message === 'QUOTA_EXCEEDED') {
                    addMessage('⚠️ محدودیت استفاده روزانه API تمام شده است.', 'bot');
                } else {
                    addMessage(`❌ خطایی در ارتباط با سرور رخ داد: ${error.message}`, 'bot');
                }
            } finally {
                // فعال‌سازی مجدد ورودی
                sendButton.disabled = false; userInput.disabled = false; micButton.disabled = false;
                if (window.innerWidth > 768 && !isMobileDevice()) {
                    userInput.focus();
                }
            }
        }

        // *** حذف شد: این تابع دیگر لازم نیست ***
        // async function startAnalysis() { ... }

        sendButton.addEventListener('click', sendMessage);
        newChatButton.addEventListener('click', startNewChat);
        micButton.addEventListener('click', toggleSpeechRecognition);
        themeToggle.addEventListener('click', toggleTheme);
        shareButton.addEventListener('click', openShareModal);
        closeShareModal.addEventListener('click', closeShareModalHandler);
        copyShareLink.addEventListener('click', copyToClipboard);
        
        // بستن مودال با کلیک خارج از آن
        window.addEventListener('click', (event) => {
            if (event.target === shareModal) {
                closeShareModalHandler();
            }
        });
        // Function to detect mobile devices
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
        }

        userInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                if (isMobileDevice()) {
                    // در موبایل: Enter = خط جدید، Shift+Enter = ارسال
                    if (event.shiftKey) {
                        event.preventDefault();
                        sendMessage();
                    }
                    // اگر Shift+Enter نیست، اجازه می‌دهیم خط جدید ایجاد شود (رفتار پیش‌فرض)
                } else {
                    // در دسکتاپ: Enter = ارسال، Shift+Enter = خط جدید
                    if (!event.shiftKey) {
                        event.preventDefault();
                        sendMessage();
                    }
                    // اگر Shift+Enter است، اجازه می‌دهیم خط جدید ایجاد شود
                }
            }
        });
        
        userInput.addEventListener('input', () => {
            const lineHeight = parseInt(window.getComputedStyle(userInput).lineHeight);
            const minHeight = 24;
            const twoLineHeight = lineHeight * 2;
            
            userInput.style.height = 'auto';
            const scrollHeight = userInput.scrollHeight;
            
            // اگر محتوا کمتر از 2 خط باشد، ارتفاع را 24 نگه دار
            if (scrollHeight <= twoLineHeight) {
                userInput.style.height = minHeight + 'px';
            } else {
                userInput.style.height = scrollHeight + 'px';
            }
            
            const maxHeight = parseInt(window.getComputedStyle(userInput).maxHeight);
            if (userInput.scrollHeight > maxHeight) {
                userInput.style.overflowY = 'auto';
            } else {
                userInput.style.overflowY = 'hidden';
            }
        });

        // Event listener برای visibility change
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && currentTypingData) {
                // وقتی به تب برمی‌گردیم، تایپ را ادامه می‌دهیم
                resumeTypingIfNeeded();
            }
        });

        // اسکرول chat-messages وقتی موس در خارج از آن است
        document.addEventListener('wheel', (event) => {
            const chatMessagesElement = document.getElementById('chat-messages');
            const rect = chatMessagesElement.getBoundingClientRect();
            const mouseX = event.clientX;
            const mouseY = event.clientY;
            
            // بررسی اینکه آیا موس در خارج از chat-messages است
            const isOutsideChat = mouseX < rect.left || mouseX > rect.right || 
                                 mouseY < rect.top || mouseY > rect.bottom;
            
            if (isOutsideChat && !event.ctrlKey && !event.metaKey) {
                // جلوگیری از اسکرول صفحه و اسکرول chat-messages به جای آن
                event.preventDefault();
                chatMessagesElement.scrollTop += event.deltaY;
            }
        }, { passive: false });

        // تابع بررسی وضعیت احراز هویت ادمین

                    simulationTestButton.classList.remove('show');

                    simulationTestButton.classList.remove('show');
