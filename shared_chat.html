<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت اشتراکی - مشاور شغلی هزارجاب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Dark mode styles */
        body.dark-mode {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        
        body.dark-mode .chat-header {
            background-color: #2d2d2d;
            color: #ffffff;
            border-bottom-color: #404040;
        }
        
        body.dark-mode .chat-messages {
            background-color: #1a1a1a;
        }
        
        /* مخفی کردن اسکرول‌بار در همه مرورگرها */
        ::-webkit-scrollbar {
            display: none;
        }
        
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .chat-header {
            background-color: #fff;
            color: #333;
            padding: 15px 25px;
            font-size: 1.1em;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e9ecef;
            flex-shrink: 0;
        }
        
        .chat-header-content {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .back-button {
            background-color: #fff;
            color: #333;
            border: 1px solid #dee2e6;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            transition: all 0.2s;
            text-decoration: none;
        }
        
        .back-button:hover { 
            background-color: #f8f9fa; 
            border-color: #ced4da; 
        }
        
        .theme-toggle {
            background-color: #fff;
            color: #333;
            border: 1px solid #dee2e6;
            padding: 8px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }
        
        .theme-toggle:hover { 
            background-color: #f8f9fa; 
            border-color: #ced4da; 
        }
        
        body.dark-mode .back-button {
            background-color: #404040;
            color: #ffffff;
            border-color: #555555;
        }
        
        body.dark-mode .back-button:hover {
            background-color: #555555;
        }
        
        body.dark-mode .theme-toggle {
            background-color: #404040;
            color: #ffffff;
            border-color: #555555;
        }
        
        body.dark-mode .theme-toggle:hover {
            background-color: #555555;
        }
        
        .chat-messages {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        
        .message-row {
            display: flex;
            align-items: flex-end;
            margin-bottom: 20px;
            gap: 10px;
        }
        
        .user-row { justify-content: flex-start; }
        .bot-row { justify-content: flex-end; }
        
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #f1f3f5;
            color: #868e96;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            flex-shrink: 0;
        }
        
        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
        }
        
        .user-message { 
            background-color: #007bff; 
            color: white; 
            border-bottom-right-radius: 5px; 
        }
        
        .bot-message { 
            background-color: #fff; 
            color: #333; 
            border: 1px solid #e9ecef; 
            border-bottom-left-radius: 5px; 
        }
        
        body.dark-mode .user-message {
            background-color: #007bff;
            color: white;
        }
        
        body.dark-mode .bot-message {
            background-color: #404040;
            color: #ffffff;
        }
        
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            flex-direction: column;
            gap: 20px;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #666;
            font-size: 1.1em;
        }
        
        body.dark-mode .loading-text {
            color: #ccc;
        }
        
        .error-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            flex-direction: column;
            gap: 20px;
            text-align: center;
            padding: 20px;
        }
        
        .error-icon {
            font-size: 4em;
            color: #dc3545;
        }
        
        .error-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #dc3545;
        }
        
        .error-message {
            color: #666;
            font-size: 1.1em;
            max-width: 500px;
        }
        
        body.dark-mode .error-message {
            color: #ccc;
        }
        
        .chat-info {
            background-color: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #1976d2;
        }
        
        body.dark-mode .chat-info {
            background-color: #1a237e;
            border-color: #283593;
            color: #90caf9;
        }
        
        .chat-info i {
            margin-left: 8px;
        }
        
        .view-count {
            margin-top: 10px;
            font-size: 0.85em;
            opacity: 0.8;
        }
        
        .profile-button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        
        .profile-button:hover {
            background-color: #45a049;
        }
        
        body.dark-mode .profile-button {
            background-color: #4caf50;
        }
        
        body.dark-mode .profile-button:hover {
            background-color: #45a049;
        }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 0;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        body.dark-mode .modal-content {
            background-color: #2d2d2d;
            color: #ffffff;
        }
        
        .modal-header {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        body.dark-mode .modal-header {
            background-color: #404040;
            border-bottom-color: #555555;
        }
        
        .modal-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin: 0;
        }
        
        body.dark-mode .modal-title {
            color: #ffffff;
        }
        
        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }
        
        .close:hover,
        .close:focus {
            color: #000;
        }
        
        body.dark-mode .close:hover,
        body.dark-mode .close:focus {
            color: #fff;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .profile-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .profile-table th,
        .profile-table td {
            border: 1px solid #e9ecef;
            padding: 12px;
            text-align: right;
        }
        
        .profile-table th {
            background-color: #f8f9fa;
            font-weight: bold;
            color: #333;
        }
        
        body.dark-mode .profile-table th {
            background-color: #404040;
            color: #ffffff;
        }
        
        body.dark-mode .profile-table th,
        body.dark-mode .profile-table td {
            border-color: #555555;
        }
        
        .profile-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        body.dark-mode .profile-table tr:nth-child(even) {
            background-color: #404040;
        }
        
        .score-cell {
            text-align: center;
            font-weight: bold;
        }
        
        .section-title {
            font-size: 1.1em;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #007bff;
        }
        
        body.dark-mode .section-title {
            color: #90caf9;
        }
        
        .no-profile {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 40px 20px;
        }
        
        body.dark-mode .no-profile {
            color: #ccc;
        }
        
        /* Mobile Responsive Design */
        @media (max-width: 768px) {
            body {
                margin: 0;
                padding: 0;
                overflow-x: hidden;
                height: 100vh;
                height: 100dvh; /* Dynamic viewport height for mobile */
                width: 100vw;
                width: 100dvw; /* Dynamic viewport width for mobile */
            }
            
            .chat-header {
                padding: 10px 0;
                font-size: 1em;
            }
            
            .chat-header-content {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
                padding: 0 15px;
            }
            
            .header-right {
                justify-content: space-between;
                flex-wrap: nowrap;
                width: 100%;
            }
            
            .back-button {
                order: 1;
                flex: 1;
                min-width: 120px;
            }
            
            .theme-toggle {
                order: 2;
                width: 36px;
                height: 36px;
                padding: 8px;
                border-radius: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .chat-messages {
                padding: 15px;
                margin: 0;
                height: calc(100vh - 100px);
                height: calc(100dvh - 100px);
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
            }
            
            .message {
                max-width: 85%;
                padding: 10px 15px;
                font-size: 0.95em;
            }
            
            .chat-info {
                padding: 12px;
                font-size: 0.85em;
            }
            
            /* Hide bot avatar on mobile */
            .bot-row .avatar {
                display: none;
            }
        }
        
        @media (max-width: 480px) {
            body {
                margin: 0;
                padding: 0;
                overflow-x: hidden;
                height: 100vh;
                height: 100dvh;
                width: 100vw;
                width: 100dvw;
            }
            
            .chat-header {
                padding: 8px 0;
            }
            
            .chat-header-content {
                padding: 0 10px;
            }
            
            .back-button {
                font-size: 0.8em;
                padding: 6px 12px;
            }
            
            .theme-toggle {
                width: 32px;
                height: 32px;
                padding: 6px;
            }
            
            .chat-messages {
                padding: 10px;
                margin: 0;
                height: calc(100vh - 80px);
                height: calc(100dvh - 80px);
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
            }
            
            .message {
                max-width: 90%;
                padding: 8px 12px;
                font-size: 0.9em;
            }
            
            .avatar {
                width: 28px;
                height: 28px;
                font-size: 0.9em;
            }
            
            .chat-info {
                padding: 10px;
                font-size: 0.8em;
            }
            
            .loading-text {
                font-size: 1em;
            }
            
            .error-title {
                font-size: 1.3em;
            }
            
            .error-message {
                font-size: 1em;
            }
            
            /* Hide bot avatar on small mobile */
            .bot-row .avatar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="chat-header">
        <div class="chat-header-content">
            <div>چت اشتراکی - مشاور شغلی هزارجاب</div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
                <a href="/" class="back-button">بازگشت به صفحه اصلی</a>
            </div>
        </div>
    </div>
    
    <div class="chat-messages" id="chat-messages">
        <div class="loading-container" id="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">در حال بارگذاری چت...</div>
        </div>
    </div>
    
    <!-- Modal for Career Profile -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">پروفایل شغلی</h2>
                <span class="close" id="closeModal">&times;</span>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content will be loaded here -->
            </div>
        </div>
    </div>
    
    <script>
        const chatMessages = document.getElementById('chat-messages');
        const loadingContainer = document.getElementById('loading-container');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        
        // دریافت share_id از URL
        const pathParts = window.location.pathname.split('/');
        const shareId = pathParts[pathParts.length - 1];
        
        function addMessage(text, sender) {
            const messageRow = document.createElement('div');
            messageRow.classList.add('message-row', sender === 'user' ? 'user-row' : 'bot-row');
            
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
            
            // تبدیل خط‌های جدید به <br> برای همه پیام‌ها
            if (sender === 'bot') {
                // برای متن‌های bot که از قبل فرمت‌بندی شده‌اند
                messageElement.innerHTML = text.replace(/\n/g, '<br>');
            } else {
                // برای پیام‌های کاربر escape کردن و تبدیل خط‌های جدید
                const sanitizedText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                messageElement.innerHTML = sanitizedText.replace(/\n/g, '<br>');
            }
            
            if (sender === 'user') {
                messageRow.appendChild(messageElement);
            } else { // Bot
                const avatar = document.createElement('div');
                avatar.classList.add('avatar');
                avatar.innerHTML = '<i class="fa-solid fa-robot"></i>';
                messageRow.appendChild(messageElement);
                messageRow.appendChild(avatar);
            }
            
            chatMessages.appendChild(messageRow);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function showError(message) {
            loadingContainer.innerHTML = `
                <div class="error-container">
                    <div class="error-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div class="error-title">خطا در بارگذاری</div>
                    <div class="error-message">${message}</div>
                </div>
            `;
        }
        
        function showChatInfo(data) {
            const chatInfo = document.createElement('div');
            chatInfo.classList.add('chat-info');
            
            let profileButton = '';
            if (data.career_profile) {
                profileButton = `
                    <button class="profile-button" onclick="showCareerProfile()">
                        <i class="fas fa-user-tie"></i>
                        نمایش پروفایل شغلی این چت
                    </button>
                `;
            }
            
            chatInfo.innerHTML = `
                <div>
                    <i class="fas fa-share-alt"></i>
                    این چت به صورت اشتراکی نمایش داده می‌شود
                </div>
                <div class="view-count">
                    <i class="fas fa-eye"></i>
                    ${data.view_count} بار مشاهده شده
                </div>
                ${profileButton}
            `;
            chatMessages.appendChild(chatInfo);
            
            // ذخیره career_profile برای استفاده در مودال
            window.sharedCareerProfile = data.career_profile;
        }
        
        async function loadSharedChat() {
            try {
                const response = await fetch(`/api/shared/${shareId}`);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        showError('چت اشتراکی یافت نشد یا منقضی شده است.');
                    } else {
                        showError('خطا در دریافت چت اشتراکی.');
                    }
                    return;
                }
                
                const data = await response.json();
                
                // حذف loading container
                loadingContainer.remove();
                
                // نمایش اطلاعات چت
                showChatInfo(data);
                
                // نمایش پیام‌ها
                data.conversation.forEach(message => {
                    addMessage(message.text, message.role);
                });
                
            } catch (error) {
                console.error('Error loading shared chat:', error);
                showError('خطا در ارتباط با سرور.');
            }
        }
        
        function toggleTheme() {
            const body = document.body;
            const isDark = body.classList.contains('dark-mode');
            
            if (isDark) {
                body.classList.remove('dark-mode');
                themeIcon.className = 'fas fa-moon';
                localStorage.setItem('theme', 'light');
            } else {
                body.classList.add('dark-mode');
                themeIcon.className = 'fas fa-sun';
                localStorage.setItem('theme', 'dark');
            }
        }
        
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeIcon.className = 'fas fa-sun';
            }
        }
        
        // Modal functions
        function showCareerProfile() {
            const modal = document.getElementById('profileModal');
            const modalBody = document.getElementById('modalBody');
            
            if (!window.sharedCareerProfile) {
                modalBody.innerHTML = '<div class="no-profile">پروفایل شغلی برای این چت موجود نیست.</div>';
            } else {
                modalBody.innerHTML = generateProfileTable(window.sharedCareerProfile);
            }
            
            modal.style.display = 'block';
        }
        
        function closeModal() {
            const modal = document.getElementById('profileModal');
            modal.style.display = 'none';
        }
        
        function generateProfileTable(profile) {
            let html = '';
            
            // Job Zone
            if (profile.job_zone) {
                html += `
                    <div class="section-title">منطقه شغلی (Job Zone)</div>
                    <table class="profile-table">
                        <tr>
                            <th>منطقه شغلی</th>
                            <td class="score-cell">${profile.job_zone}</td>
                        </tr>
                    </table>
                `;
            }
            
            // Interests (RIASEC)
            if (profile.interests) {
                html += `
                    <div class="section-title">علایق شغلی (RIASEC)</div>
                    <table class="profile-table">
                        <tr>
                            <th>نوع علاقه</th>
                            <th>امتیاز</th>
                        </tr>
                `;
                
                const riasecNames = {
                    'Realistic': 'واقع‌گرا (Realistic)',
                    'Investigative': 'جستجوگر (Investigative)',
                    'Artistic': 'هنری (Artistic)',
                    'Social': 'اجتماعی (Social)',
                    'Enterprising': 'متهور (Enterprising)',
                    'Conventional': 'قراردادی (Conventional)'
                };
                
                Object.entries(profile.interests).forEach(([key, value]) => {
                    const persianName = riasecNames[key] || key;
                    html += `
                        <tr>
                            <td>${persianName}</td>
                            <td class="score-cell">${value}</td>
                        </tr>
                    `;
                });
                
                html += '</table>';
            }
            
            // Work Values
            if (profile.work_values) {
                html += `
                    <div class="section-title">ارزش‌های کاری (Work Values)</div>
                    <table class="profile-table">
                        <tr>
                            <th>ارزش کاری</th>
                            <th>امتیاز</th>
                        </tr>
                `;
                
                const workValuesNames = {
                    'Achievement': 'دستاورد (Achievement)',
                    'Independence': 'استقلال (Independence)',
                    'Recognition': 'تشخیص (Recognition)',
                    'Relationships': 'روابط (Relationships)',
                    'Support': 'حمایت (Support)',
                    'Working_Conditions': 'شرایط کاری (Working Conditions)'
                };
                
                Object.entries(profile.work_values).forEach(([key, value]) => {
                    const persianName = workValuesNames[key] || key;
                    html += `
                        <tr>
                            <td>${persianName}</td>
                            <td class="score-cell">${value}</td>
                        </tr>
                    `;
                });
                
                html += '</table>';
            }
            
            // Work Styles
            if (profile.work_styles) {
                html += `
                    <div class="section-title">سبک‌های کاری (Work Styles)</div>
                    <table class="profile-table">
                        <tr>
                            <th>سبک کاری</th>
                            <th>امتیاز</th>
                        </tr>
                `;
                
                const workStylesNames = {
                    'Achievement_Effort': 'دستاورد/تلاش (Achievement/Effort)',
                    'Adaptability_Flexibility': 'انطباق/انعطاف (Adaptability/Flexibility)',
                    'Analytical_Thinking': 'تفکر تحلیلی (Analytical Thinking)',
                    'Attention_to_Detail': 'توجه به جزئیات (Attention to Detail)',
                    'Cooperation': 'همکاری (Cooperation)',
                    'Concern_for_Others': 'نگرانی برای دیگران (Concern for Others)',
                    'Dependability': 'قابل اعتماد بودن (Dependability)',
                    'Independence': 'استقلال (Independence)',
                    'Initiative': 'ابتکار (Initiative)',
                    'Innovation': 'نوآوری (Innovation)',
                    'Integrity': 'صداقت (Integrity)',
                    'Leadership': 'رهبری (Leadership)',
                    'Persistence': 'پایداری (Persistence)',
                    'Self_Control': 'خودکنترلی (Self Control)',
                    'Social_Orientation': 'گرایش اجتماعی (Social Orientation)',
                    'Stress_Tolerance': 'تحمل استرس (Stress Tolerance)'
                };
                
                Object.entries(profile.work_styles).forEach(([key, value]) => {
                    const persianName = workStylesNames[key] || key;
                    html += `
                        <tr>
                            <td>${persianName}</td>
                            <td class="score-cell">${value}</td>
                        </tr>
                    `;
                });
                
                html += '</table>';
            }
            
            return html;
        }
        
        // Event listeners
        themeToggle.addEventListener('click', toggleTheme);
        
        // Modal event listeners
        const modal = document.getElementById('profileModal');
        const closeBtn = document.getElementById('closeModal');
        
        closeBtn.addEventListener('click', closeModal);
        
        // Close modal when clicking outside of it
        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                closeModal();
            }
        });
        
        // اسکرول chat-messages وقتی موس در خارج از آن است
        document.addEventListener('wheel', (event) => {
            const chatMessagesElement = document.getElementById('chat-messages');
            const rect = chatMessagesElement.getBoundingClientRect();
            const mouseX = event.clientX;
            const mouseY = event.clientY;
            
            // بررسی اینکه آیا موس در خارج از chat-messages است
            const isOutsideChat = mouseX < rect.left || mouseX > rect.right || 
                                 mouseY < rect.top || mouseY > rect.bottom;
            
            if (isOutsideChat && !event.ctrlKey && !event.metaKey) {
                // جلوگیری از اسکرول صفحه و اسکرول chat-messages به جای آن
                event.preventDefault();
                chatMessagesElement.scrollTop += event.deltaY;
            }
        }, { passive: false });
        
        // بارگذاری اولیه
        window.addEventListener('load', () => {
            loadTheme();
            if (shareId && shareId !== '') {
                loadSharedChat();
            } else {
                showError('شناسه چت اشتراکی نامعتبر است.');
            }
        });
    </script>
</body>
</html>
