<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاور شغلی هزارجاب</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Dark mode styles */
        body.dark-mode {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        
        body.dark-mode .chat-header {
            background-color: #2d2d2d;
            color: #ffffff;
            border-bottom-color: #404040;
        }
        
        body.dark-mode .chat-messages {
            background-color: #1a1a1a;
        }
        
        body.dark-mode .chat-input {
            background-color: #2d2d2d;
            border-top-color: #404040;
        }
        
        body.dark-mode #user-input {
            background-color: #404040;
            color: #ffffff;
            border-color: #555555;
        }
        
        body.dark-mode #user-input:focus {
            border-color: #007bff;
        }
        
        body.dark-mode .user-message {
            background-color: #007bff;
            color: white;
        }
        
        body.dark-mode .bot-message {
            background-color: #404040;
            color: #ffffff;
        }
        
        body.dark-mode .chat-input button {
            color: #ffffff;
        }
        
        body.dark-mode .chat-input button:hover {
            color: #cccccc;
        }
        
        body.dark-mode .chat-input button:disabled {
            color: #666666;
        }
        
        /* مخفی کردن اسکرول‌بار در همه مرورگرها */
        ::-webkit-scrollbar {
            display: none;
        }
        
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .chat-header {
            background-color: #fff;
            color: #333;
            padding: 15px 25px;
            font-size: 1.1em;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e9ecef;
            flex-shrink: 0;
        }
        
        .chat-header-content {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quick-test-button {
            background-color: #28a745;
            color: white;
            border: 1px solid #28a745;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            transition: all 0.2s;
            display: none;
        }

        .quick-test-button.show {
            display: block;
        }

        .quick-test-button:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }

        body.dark-mode .quick-test-button {
            background-color: #28a745;
            color: white;
            border-color: #28a745;
        }

        body.dark-mode .quick-test-button:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }

        .simulation-test-button {
            background-color: #ffc107;
            color: black;
            border: 1px solid #ffc107;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            transition: all 0.2s;
            display: none;
        }

        .simulation-test-button.show {
            display: block;
        }

        .simulation-test-button:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }

        body.dark-mode .simulation-test-button {
            background-color: #ffc107;
            color: black;
            border-color: #ffc107;
        }

        body.dark-mode .simulation-test-button:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }
        .new-chat-button {
            background-color: #fff;
            color: #333;
            border: 1px solid #dee2e6;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            transition: all 0.2s;
        }
        .new-chat-button:hover { background-color: #f8f9fa; border-color: #ced4da; }
        
        .theme-toggle {
            background-color: #fff;
            color: #333;
            border: 1px solid #dee2e6;
            padding: 8px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }
        
        .theme-toggle:hover { 
            background-color: #f8f9fa; 
            border-color: #ced4da; 
        }
        
        body.dark-mode .theme-toggle {
            background-color: #404040;
            color: #ffffff;
            border-color: #555555;
        }
        
        body.dark-mode         .theme-toggle:hover {
            background-color: #555555;
        }
        
        .share-button {
            background-color: #fff;
            color: #333;
            border: 1px solid #dee2e6;
            padding: 8px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }
        
        .share-button:hover { 
            background-color: #f8f9fa; 
            border-color: #ced4da; 
        }
        
        body.dark-mode .share-button {
            background-color: #404040;
            color: #ffffff;
            border-color: #555555;
        }
        
        body.dark-mode .share-button:hover {
            background-color: #555555;
        }
        
        body.dark-mode .new-chat-button {
            background-color: #404040;
            color: #ffffff;
            border-color: #555555;
        }
        
        body.dark-mode .new-chat-button:hover {
            background-color: #555555;
            border-color: #666666;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .message-row {
            display: flex;
            align-items: flex-end;
            margin-bottom: 20px;
            gap: 10px;
        }
        .user-row { justify-content: flex-start; }
        .bot-row { justify-content: flex-end; }
        
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #f1f3f5;
            color: #868e96;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            flex-shrink: 0;
        }

        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
        }
        .user-message { background-color: #007bff; color: white; border-bottom-right-radius: 5px; }
        .bot-message { background-color: #fff; color: #333; border: 1px solid #e9ecef; border-bottom-left-radius: 5px; }
        .copy-icon { color: #adb5bd; cursor: pointer; font-size: 0.9em; padding: 5px; opacity: 0; transition: opacity 0.2s, color 0.2s; }
        .message-row:hover .copy-icon { opacity: 1; }
        .copy-icon:hover { color: #343a40; }
        .copy-icon .fa-check { color: #28a745; }
        .typing-indicator { padding: 12px 15px; }
        .typing-indicator span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #aaa; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        .chat-input { border-top: 1px solid #e9ecef; background-color: #fff; padding: 15px 25px; }
        
        .chat-input-content {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 0 20px;
            box-sizing: border-box;
        }
        #user-input {
            flex-grow: 1;
            padding: 12px 18px;
            border: 1px solid #dee2e6;
            border-radius: 25px;
            font-size: 1em;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            resize: none;
            line-height: 1.5;
            min-height: 24px; 
            height: 24px;
            max-height: calc(1.5em * 5 + 24px);
            overflow: hidden; 
        }
        #user-input:focus { outline: none; border-color: #a6cffb; }
        .chat-input .input-buttons { display: flex; align-items: center; gap: 5px; }
        .chat-input button { background-color: transparent; color: #6c757d; border: none; padding: 10px; border-radius: 50%; cursor: pointer; font-size: 1.6em; line-height: 1; transition: all 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .chat-input button:hover { color: #343a40; }
        .chat-input button:disabled { color: #ced4da; }
        #user-input:disabled { background-color: #e9ecef; }
        @keyframes pulse-shadow { 0%, 100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); } 50% { box-shadow: 0 0 0 8px rgba(220, 53, 69, 0); } }
        @keyframes pulse-icon { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .mic-button.recording { color: #dc3545; animation: pulse-shadow 1.5s infinite; }
        .mic-button.recording i { animation: pulse-icon 1.5s infinite ease-in-out; }
        .speech-status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 0, 0, 0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.9em; z-index: 1000; display: none; }
        
        /* مودال اشتراک‌گذاری */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease-out;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .modal-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin: 0;
        }
        
        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .close:hover {
            color: #000;
        }
        
        .modal-body {
            margin-bottom: 20px;
        }
        
        .share-link-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .share-link-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            font-size: 0.9em;
            background-color: #f8f9fa;
            color: #333;
        }
        
        .copy-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: 'Vazirmatn', Vazirmatn, Tahoma, Arial, sans-serif;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        
        .copy-button:hover {
            background-color: #0056b3;
        }
        
        .copy-button.copied {
            background-color: #28a745;
        }
        
        .share-warning {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85em;
            margin-top: 15px;
        }
        
        /* حالت تاریک برای مودال */
        body.dark-mode .modal-content {
            background-color: #2d2d2d;
            color: #ffffff;
        }
        
        body.dark-mode .modal-title {
            color: #ffffff;
        }
        
        body.dark-mode .close {
            color: #ccc;
        }
        
        body.dark-mode .close:hover {
            color: #ffffff;
        }
        
        body.dark-mode .share-link-input {
            background-color: #404040;
            color: #ffffff;
            border-color: #555555;
        }
        
        body.dark-mode .share-warning {
            background-color: #3d2914;
            border-color: #6c4a00;
            color: #ffc107;
        }
        
        /* Mobile Responsive Design */
        @media (max-width: 768px) {
            body {
                margin: 0;
                padding: 0;
                overflow-x: hidden;
                height: 100vh;
                height: 100dvh; /* Dynamic viewport height for mobile */
                width: 100vw;
                width: 100dvw; /* Dynamic viewport width for mobile */
            }
            
            .chat-header {
                padding: 10px 0;
                font-size: 1em;
            }
            
            .chat-header-content {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
                padding: 0 15px;
            }
            
            .header-right {
                justify-content: space-between;
                flex-wrap: nowrap;
                width: 100%;
            }
            
            .new-chat-button, .quick-test-button, .simulation-test-button {
                order: 1;
                flex: 1;
                min-width: 120px;
                padding: 8px 16px;
                border-radius: 8px;
                font-size: 0.9em;
                text-align: center;
            }

            .theme-toggle, .share-button {
                order: 2;
                width: 36px;
                height: 36px;
                padding: 8px;
                border-radius: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .chat-messages {
                padding: 15px;
                margin: 0;
                height: calc(100vh - 140px);
                height: calc(100dvh - 140px);
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
            }
            
            .message {
                max-width: 85%;
                padding: 10px 15px;
                font-size: 0.95em;
            }
            
            .chat-input {
                padding: 10px 0;
                margin: 0;
                width: 100%;
            }
            
            .chat-input-content {
                gap: 8px;
                width: 100%;
                padding: 0 15px;
            }
            
            #user-input {
                font-size: 16px; /* Prevent zoom on iOS */
                padding: 10px 15px;
            }
            
            .chat-input button {
                padding: 8px;
                font-size: 1.4em;
            }
            
            .modal-content {
                margin: 10% auto;
                padding: 20px;
                width: 95%;
            }
            
            .share-link-container {
                flex-direction: column;
                gap: 10px;
            }
            
            .copy-button {
                width: 100%;
            }
            
            /* Hide bot avatar on mobile */
            .bot-row .avatar {
                display: none;
            }
        }
        
        @media (max-width: 480px) {
            body {
                margin: 0;
                padding: 0;
                overflow-x: hidden;
                height: 100vh;
                height: 100dvh;
                width: 100vw;
                width: 100dvw;
            }
            
            .chat-header {
                padding: 8px 0;
            }
            
            .chat-header-content {
                padding: 0 10px;
            }
            
            .new-chat-button, .quick-test-button, .simulation-test-button {
                min-width: 100px;
                padding: 6px 12px;
                border-radius: 8px;
                font-size: 0.8em;
                text-align: center;
            }
            
            .theme-toggle, .share-button {
                width: 32px;
                height: 32px;
                padding: 6px;
            }
            
            .chat-messages {
                padding: 10px;
                margin: 0;
                height: calc(100vh - 120px);
                height: calc(100dvh - 120px);
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
            }
            
            .message {
                max-width: 90%;
                padding: 8px 12px;
                font-size: 0.9em;
            }
            
            .avatar {
                width: 28px;
                height: 28px;
                font-size: 0.9em;
            }
            
            .chat-input {
                padding: 8px 0;
                margin: 0;
                width: 100%;
            }
            
            .chat-input-content {
                padding: 0 10px;
            }
            
            #user-input {
                padding: 8px 12px;
                font-size: 15px;
            }
            
            .modal-content {
                margin: 5% auto;
                padding: 15px;
            }
            
            .modal-title {
                font-size: 1.1em;
            }
            
            /* Hide bot avatar on small mobile */
            .bot-row .avatar {
                display: none;
            }
        }

        /* --- استایل برای جدول‌های Markdown --- */
        .bot-message table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            background-color: #ffffff;
            font-size: 0.9em;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e9ecef;
        }
        .bot-message th, .bot-message td {
            border: 1px solid #e9ecef;
            padding: 10px 12px;
            text-align: right;
        }
        .bot-message th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        /* --- استایل جدول در حالت تاریک --- */
        body.dark-mode .bot-message table {
            background-color: #2d2d2d;
            border-color: #404040;
        }
        body.dark-mode .bot-message th, body.dark-mode .bot-message td {
            border-color: #404040;
        }
        body.dark-mode .bot-message th {
            background-color: #404040;
        }

    </style>
</head>
<body>
    <div class="chat-header">
        <div class="chat-header-content">
            <div>مشاور شغلی هزارجاب</div>
            <div class="header-right">
                <button class="quick-test-button" id="quick-test-button" title="تست سریع (ادمین)">⚡ تست سریع</button>
                <button class="simulation-test-button" id="simulation-test-button" title="تست شبیه‌سازی پیشرفته (ادمین)">🧪 تست شبیه‌سازی</button>
                <button class="share-button" id="share-button" title="اشتراک‌گذاری چت">
                    <i class="fas fa-share-alt"></i>
                </button>
                <button class="theme-toggle" id="theme-toggle">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
                <button class="new-chat-button" id="new-chat-button">+ گفت‌وگوی جدید</button>
            </div>
        </div>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input" id="chat-input">
        <div class="chat-input-content">
            <textarea id="user-input" placeholder="پیام خود را بنویسید..." rows="1"></textarea>
            <div class="input-buttons">
                <button id="mic-button" class="mic-button"><i class="fas fa-microphone"></i></button>
                <button id="send-button"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <div id="speech-status" class="speech-status"></div>
    
    <div id="share-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">اشتراک‌گذاری چت</h3>
                <span class="close" id="close-share-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="share-link-container">
                    <input type="text" id="share-link-input" class="share-link-input" readonly>
                    <button id="copy-share-link" class="copy-button">کپی لینک</button>
                </div>
                <div class="share-warning">
                    <i class="fas fa-exclamation-triangle"></i>
                    توجه: با اشتراک‌گذاری این لینک، تمامی محتوای چت شما در دسترس دیگران قرار می‌گیرد.
                </div>
            </div>
        </div>
    </div>
    <script>
        // Configuration
        // برای تغییر URL سرور، این متغیرها را تغییر دهید:
        // مثال: const API_BASE_URL = 'https://your-domain.com';
        // یا: const API_BASE_URL = 'http://localhost:5000';
        const API_BASE_URL = window.location.origin; // استفاده از همان دامنه فعلی
        const CHAT_API_ENDPOINT = `${API_BASE_URL}/chat`;
        const SHARE_API_ENDPOINT = `${API_BASE_URL}/share-chat`;
        // *** حذف شد: دیگر نیازی به این اندپوینت نیست ***
        // const ANALYSIS_API_ENDPOINT = `${API_BASE_URL}/start-analysis`;

        marked.setOptions({
            breaks: true, // هر اینتر را به <br> تبدیل می‌کند
            gfm: true     // Markdown پیشرفته گیت‌هاب (برای جدول، خط خورده و غیره) را فعال می‌کند
        });
        // DOM Elements
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const newChatButton = document.getElementById('new-chat-button');
        const micButton = document.getElementById('mic-button');
        const speechStatus = document.getElementById('speech-status');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const shareButton = document.getElementById('share-button');
        const shareModal = document.getElementById('share-modal');
        const closeShareModal = document.getElementById('close-share-modal');
        const shareLinkInput = document.getElementById('share-link-input');
        const copyShareLink = document.getElementById('copy-share-link');
        const quickTestButton = document.getElementById('quick-test-button');
        const simulationTestButton = document.getElementById('simulation-test-button');
        
        let userId = 'web_user_' + Date.now() + Math.random().toString(36).substr(2, 9);
        let recognition = null;
        let isRecording = false;
        let userCareerProfile = null;
        let finalTranscript = ''; // ذخیره تمام متن نهایی تایید شده
        let isQuickTestMode = false; // برای غیرفعال کردن انیمیشن تایپ در تست سریع
        let silenceTimeout = null; // برای مدیریت سکوت
        let restartAttempts = 0; // شمارنده تلاش برای restart
        
        // متغیرهای مربوط به تایپ در پس‌زمینه
        let currentTypingInterval = null;
        let typingStartTime = null;
        let typingSpeed = 3; // میلی‌ثانیه بین هر کاراکتر (سرعت بالا)
        let currentTypingData = null;
        
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'fa-IR';
            
            recognition.onstart = () => { isRecording = true; micButton.classList.add('recording'); };
            
            recognition.onresult = (event) => {
                // پاک کردن timeout سکوت قبلی
                if (silenceTimeout) {
                    clearTimeout(silenceTimeout);
                }
                
                let interimTranscript = '';

                // پردازش نتایج از resultIndex تا آخر
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript;

                    if (event.results[i].isFinal) {
                        // اگر نتیجه نهایی است، به finalTranscript اضافه کن
                        finalTranscript += transcript;
                        // ریست کردن شمارنده restart
                        restartAttempts = 0;
                    } else {
                        // اگر نتیجه موقت است، به interimTranscript اضافه کن
                        interimTranscript += transcript;
                    }
                }

                // نمایش متن نهایی + متن موقت در input
                userInput.value = finalTranscript + interimTranscript;
                userInput.dispatchEvent(new Event('input'));
                
                // تنظیم timeout برای تشخیص سکوت (5 ثانیه)
                silenceTimeout = setTimeout(() => {
                    if (isRecording && restartAttempts < 3) {
                        console.log('Silence detected, restarting recognition...');
                        try {
                            recognition.stop();
                            setTimeout(() => {
                                recognition.start();
                                restartAttempts++;
                            }, 200);
                        } catch (e) {
                            console.error('Failed to restart recognition after silence:', e);
                        }
                    }
                }, 5000);
            };
            
            recognition.onerror = (event) => { 
                console.error('Speech recognition error:', event.error); 
                
                // پاک کردن timeout سکوت در صورت خطا
                if (silenceTimeout) {
                    clearTimeout(silenceTimeout);
                    silenceTimeout = null;
                }
                
                // فقط در صورت خطای جدی ضبط را متوقف کن
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    isRecording = false; 
                    micButton.classList.remove('recording');
                    restartAttempts = 0;
                } else if (event.error === 'network' || event.error === 'service-unavailable') {
                    // در صورت خطای شبکه، تلاش برای restart
                    if (isRecording && restartAttempts < 2) {
                        console.log('Network error, attempting to restart recognition...');
                        setTimeout(() => {
                            try {
                                recognition.start();
                                restartAttempts++;
                            } catch (e) {
                                console.error('Failed to restart recognition after network error:', e);
                                isRecording = false;
                                micButton.classList.remove('recording');
                                restartAttempts = 0;
                            }
                        }, 1000);
                    } else {
                        // اگر تلاش‌ها تمام شد، ضبط را متوقف کن
                        isRecording = false;
                        micButton.classList.remove('recording');
                        restartAttempts = 0;
                    }
                } else if (event.error === 'no-speech' || event.error === 'audio-capture') {
                    // برای خطاهای صوتی، تلاش برای restart
                    if (isRecording && restartAttempts < 1) {
                        console.log('Audio error, attempting to restart recognition...');
                        setTimeout(() => {
                            try {
                                recognition.start();
                                restartAttempts++;
                            } catch (e) {
                                console.error('Failed to restart recognition after audio error:', e);
                                isRecording = false;
                                micButton.classList.remove('recording');
                                restartAttempts = 0;
                            }
                        }, 500);
                    }
                }
            };
            
            recognition.onend = () => { 
                console.log('Speech recognition ended, isRecording:', isRecording);
                // ضبط خودکار متوقف نمی‌شود - فقط در صورت کلیک کاربر یا ارسال پیام
                if (isRecording && restartAttempts < 3) {
                    // تاخیر کوتاه قبل از restart برای جلوگیری از تداخل
                    setTimeout(() => {
                        try {
                            console.log('Restarting speech recognition...');
                            recognition.start();
                            restartAttempts++;
                        } catch (e) {
                            console.error('Failed to restart recognition in onend:', e);
                            // اگر restart موفق نبود، ضبط را متوقف کن
                            isRecording = false;
                            micButton.classList.remove('recording');
                            restartAttempts = 0;
                        }
                    }, 100);
                } else if (restartAttempts >= 3) {
                    // اگر تعداد تلاش‌ها زیاد شد، ضبط را متوقف کن
                    console.log('Too many restart attempts, stopping recognition');
                    isRecording = false;
                    micButton.classList.remove('recording');
                    restartAttempts = 0;
                }
            };
        } else { micButton.style.display = 'none'; }

        function createCopyIcon(textToCopy) {
            const iconContainer = document.createElement('div');
            iconContainer.classList.add('copy-icon');
            iconContainer.innerHTML = '<i class="far fa-copy"></i>';
            iconContainer.addEventListener('click', () => { navigator.clipboard.writeText(textToCopy).then(() => { iconContainer.innerHTML = '<i class="fas fa-check"></i>'; setTimeout(() => { iconContainer.innerHTML = '<i class="far fa-copy"></i>'; }, 1500); }).catch(err => { console.error('Failed to copy text: ', err); }); });
            return iconContainer;
        }

        function addMessage(text, sender) {
            const messageRow = document.createElement('div');
            messageRow.classList.add('message-row', sender === 'user' ? 'user-row' : 'bot-row');
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
            
            // ذخیره متن خام در data attribute
            messageElement.setAttribute('data-raw-text', text);
            
            if (sender === 'user') {
                const sanitizedText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                messageElement.innerHTML = sanitizedText.replace(/\n/g, '<br>');
            } else {
                // برای پیام‌های ربات، markdown را رندر کن
                messageElement.innerHTML = marked.parse(text);
            }
            
            const copyIcon = createCopyIcon(text);

            if (sender === 'user') {
                messageRow.appendChild(messageElement);
                messageRow.appendChild(copyIcon);
            } else { // Bot
                const avatar = document.createElement('div');
                avatar.classList.add('avatar');
                avatar.innerHTML = '<i class="fa-solid fa-robot"></i>';
                // تغییر ۱: تغییر ترتیب برای جابجایی آیکون کپی
                messageRow.appendChild(copyIcon);
                messageRow.appendChild(messageElement);
                messageRow.appendChild(avatar);
            }
            chatMessages.appendChild(messageRow);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function addTypedMessage(text, sender) {
            const messageRow = document.createElement('div');
            messageRow.classList.add('message-row', sender === 'user' ? 'user-row' : 'bot-row');
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
            
            // ذخیره متن خام در data attribute
            messageElement.setAttribute('data-raw-text', text);
            
            const copyIcon = createCopyIcon(text);

            if (sender === 'bot') {
                const avatar = document.createElement('div');
                avatar.classList.add('avatar');
                avatar.innerHTML = '<i class="fa-solid fa-robot"></i>';
                // تغییر ۱: تغییر ترتیب برای جابجایی آیکون کپی
                messageRow.appendChild(copyIcon);
                messageRow.appendChild(messageElement);
                messageRow.appendChild(avatar);
            }

            chatMessages.appendChild(messageRow);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            // اگر در حالت تست سریع هستیم، بدون انیمیشن نمایش بده
            if (isQuickTestMode) {
                messageElement.innerHTML = marked.parse(text);
            } else {
                // شروع تایپ
                startTypingAnimation(messageElement, text);
            }
        }
        
        function startTypingAnimation(messageElement, text) {
            let index = 0;
            const originalText = text; // حفظ متن اصلی برای markdown
            typingStartTime = Date.now();
            
            // ذخیره اطلاعات تایپ فعلی
            currentTypingData = {
                messageElement: messageElement,
                text: originalText,
                index: index,
                startTime: typingStartTime
            };
            
            const typingInterval = setInterval(() => {
                if (index < originalText.length) {
                    // دریافت متن فعلی تا این نقطه
                    const currentText = originalText.substring(0, index + 1);
                    
                    // اعمال markdown به متن فعلی
                    messageElement.innerHTML = marked.parse(currentText);
                    
                    index++;
                    currentTypingData.index = index;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                } else {
                    clearInterval(typingInterval);
                    currentTypingInterval = null;
                    currentTypingData = null;
                    // اعمال نهایی markdown (برای اطمینان)
                    messageElement.innerHTML = marked.parse(originalText);
                }
            }, typingSpeed);
            
            currentTypingInterval = typingInterval;
        }
        
        function resumeTypingIfNeeded() {
            if (!currentTypingData || !currentTypingInterval) return;
            
            const elapsed = Date.now() - currentTypingData.startTime;
            const expectedIndex = Math.floor(elapsed / typingSpeed);
            
            if (expectedIndex > currentTypingData.index) {
                // تایپ در پس‌زمینه ادامه پیدا کرده
                const skipCount = expectedIndex - currentTypingData.index;
                currentTypingData.index += skipCount;
                
                if (currentTypingData.index >= currentTypingData.text.length) {
                    // تایپ تمام شده
                    clearInterval(currentTypingInterval);
                    // اعمال نهایی markdown
                    currentTypingData.messageElement.innerHTML = marked.parse(currentTypingData.text);
                    currentTypingInterval = null;
                    currentTypingData = null;
                } else {
                    // دریافت متن فعلی تا این نقطه و اعمال markdown
                    const currentText = currentTypingData.text.substring(0, currentTypingData.index);
                    currentTypingData.messageElement.innerHTML = marked.parse(currentText);
                }
            }
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTypingIndicator() { const indicatorRow = document.getElementById('typing-indicator-row'); if (indicatorRow) indicatorRow.remove(); }
        
        function removeUserTypingIndicator() { 
            const indicatorRow = document.getElementById('user-typing-indicator-row'); 
            if (indicatorRow) indicatorRow.remove(); 
        }
        function startNewChat() {
            chatMessages.innerHTML = '';
            userId = 'web_user_' + Date.now() + Math.random().toString(36).substr(2, 9);
            finalTranscript = ''; // ریست کردن متغیر متن نهایی
            showTypingIndicator();
            setTimeout(() => { removeTypingIndicator(); addTypedMessage('سلام! من مشاور شغلی «هزارجاب» هستم. برای اینکه بتونم بهتر کمکت کنم، لطفاً خودت رو کامل معرفی کن: نام، سن، جنسیت، وضعیت شغلی فعلی و رشتهٔ تحصیلی.', 'bot'); }, 1000);
        }
        function toggleSpeechRecognition() {
            if (!recognition || sendButton.disabled) return;
            if (isRecording) {
                // توقف ضبط صدا
                recognition.stop();
                isRecording = false;
                micButton.classList.remove('recording');
                // پاک کردن timeout سکوت و ریست کردن شمارنده
                if (silenceTimeout) {
                    clearTimeout(silenceTimeout);
                    silenceTimeout = null;
                }
                restartAttempts = 0;
            } else {
                // شروع ضبط صدا - حفظ متن موجود در تکست‌باکس
                finalTranscript = userInput.value;
                restartAttempts = 0; // ریست کردن شمارنده restart
                try {
                    recognition.start();
                } catch (e) {
                    console.error('Failed to start recognition:', e);
                    isRecording = false;
                    micButton.classList.remove('recording');
                }
            }
        }
        
        function toggleTheme() {
            const body = document.body;
            const isDark = body.classList.contains('dark-mode');
            
            if (isDark) {
                body.classList.remove('dark-mode');
                themeIcon.className = 'fas fa-moon';
                localStorage.setItem('theme', 'light');
            } else {
                body.classList.add('dark-mode');
                themeIcon.className = 'fas fa-sun';
                localStorage.setItem('theme', 'dark');
            }
        }
        
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeIcon.className = 'fas fa-sun';
            }
        }
        
        async function generateShareLink() {
            try {
                const response = await fetch(SHARE_API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        conversation: getCurrentConversation(),
                        career_profile: userCareerProfile
                    })
                });
                
                if (!response.ok) {
                    throw new Error('خطا در تولید لینک اشتراک‌گذاری');
                }
                
                const data = await response.json();
                const shareUrl = `${window.location.origin}/shared/${data.share_id}`;
                shareLinkInput.value = shareUrl;
                return shareUrl;
            } catch (error) {
                console.error('Error generating share link:', error);
                shareLinkInput.value = 'خطا در تولید لینک';
                return null;
            }
        }
        
        function getCurrentConversation() {
            const messages = [];
            const messageRows = chatMessages.querySelectorAll('.message-row');
            
            messageRows.forEach(row => {
                const messageElement = row.querySelector('.message');
                if (messageElement && !row.id.includes('typing-indicator')) {
                    const isUser = row.classList.contains('user-row');
                    
                    // دریافت متن خام از data attribute
                    let text = messageElement.getAttribute('data-raw-text');
                    
                    // fallback: اگر data attribute نداشت، از textContent استفاده کن
                    if (!text) {
                        text = messageElement.textContent.trim();
                    }
                    
                    if (text) {
                        messages.push({
                            role: isUser ? 'user' : 'model',
                            parts: [text]
                        })
                    }
                }
            });
            
            return messages;
        }
        
        
        function openShareModal() {
            shareModal.style.display = 'block';
            shareLinkInput.value = 'در حال تولید لینک...';
            generateShareLink();
        }
        
        function closeShareModalHandler() {
            shareModal.style.display = 'none';
        }
        
        async function copyToClipboard() {
            try {
                await navigator.clipboard.writeText(shareLinkInput.value);
                copyShareLink.textContent = 'کپی شد!';
                copyShareLink.classList.add('copied');
                
                setTimeout(() => {
                    copyShareLink.textContent = 'کپی لینک';
                    copyShareLink.classList.remove('copied');
                }, 2000);
            } catch (error) {
                console.error('خطا در کپی کردن:', error);
                // Fallback for older browsers
                shareLinkInput.select();
                document.execCommand('copy');
                copyShareLink.textContent = 'کپی شد!';
                copyShareLink.classList.add('copied');
                
                setTimeout(() => {
                    copyShareLink.textContent = 'کپی لینک';
                    copyShareLink.classList.remove('copied');
                }, 2000);
            }
        }

        async function sendMessage() {
            const messageText = userInput.value.trim();
            if (messageText === '' || sendButton.disabled) return;
            
            // توقف ضبط صدا هنگام ارسال پیام
            if (isRecording && recognition) {
                recognition.stop();
                isRecording = false;
                micButton.classList.remove('recording');
                // پاک کردن timeout سکوت و ریست کردن شمارنده
                if (silenceTimeout) {
                    clearTimeout(silenceTimeout);
                    silenceTimeout = null;
                }
                restartAttempts = 0;
            }
            
            addMessage(messageText, 'user');
            userInput.value = '';
            finalTranscript = ''; // ریست کردن متغیر متن نهایی
            userInput.dispatchEvent(new Event('input'));
            sendButton.disabled = true; userInput.disabled = true; micButton.disabled = true;
            showTypingIndicator();

            try {
                // --- مرحله ۱: ارسال پیام و دریافت پاسخ فوری ---
                // *** تغییر: حذف conversation از body ***
                const response = await fetch(CHAT_API_ENDPOINT, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ 
                        user_id: userId, 
                        message: messageText, 
                        conversation: getCurrentConversation() // *** اصلاح: ارسال تاریخچه به بک‌اند ***
                    }), 
                });
                
                if (!response.ok) {
                    if (response.status === 429) { throw new Error('QUOTA_EXCEEDED'); }
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                removeTypingIndicator();
                
                // *** تغییر: حذف کامل بلاک if (analysis_started) ***
                // همیشه پاسخ استاندارد را نمایش بده
                addTypedMessage(data.reply, 'bot');
                
                // *** تغییر: ذخیره پروفایل اگر در پاسخ وجود داشت ***
                if (data.career_profile) {
                    userCareerProfile = data.career_profile;
                }
                
                // فعال‌سازی مجدد ورودی برای پیام بعدی
                sendButton.disabled = false; userInput.disabled = false; micButton.disabled = false;
                if (window.innerWidth > 768 && !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                    userInput.focus();
                }

            } catch (error) {
                console.error('Error in sendMessage:', error);
                removeTypingIndicator();
                if (error.message === 'QUOTA_EXCEEDED') {
                    addMessage('⚠️ محدودیت استفاده روزانه API تمام شده است.', 'bot');
                } else {
                    addMessage('❌ خطایی در ارتباط با سرور رخ داد.', 'bot');
                }
                // همیشه در صورت خطا، ورودی را فعال کن
                sendButton.disabled = false; userInput.disabled = false; micButton.disabled = false;
            }
        }

        // *** حذف شد: این تابع دیگر لازم نیست ***
        // async function startAnalysis() { ... }

        sendButton.addEventListener('click', sendMessage);
        newChatButton.addEventListener('click', startNewChat);
        micButton.addEventListener('click', toggleSpeechRecognition);
        themeToggle.addEventListener('click', toggleTheme);
        shareButton.addEventListener('click', openShareModal);
        closeShareModal.addEventListener('click', closeShareModalHandler);
        copyShareLink.addEventListener('click', copyToClipboard);
        
        // بستن مودال با کلیک خارج از آن
        window.addEventListener('click', (event) => {
            if (event.target === shareModal) {
                closeShareModalHandler();
            }
        });
        // Function to detect mobile devices
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
        }

        userInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                if (isMobileDevice()) {
                    // در موبایل: Enter = خط جدید، Shift+Enter = ارسال
                    if (event.shiftKey) {
                        event.preventDefault();
                        sendMessage();
                    }
                    // اگر Shift+Enter نیست، اجازه می‌دهیم خط جدید ایجاد شود (رفتار پیش‌فرض)
                } else {
                    // در دسکتاپ: Enter = ارسال، Shift+Enter = خط جدید
                    if (!event.shiftKey) {
                        event.preventDefault();
                        sendMessage();
                    }
                    // اگر Shift+Enter است، اجازه می‌دهیم خط جدید ایجاد شود
                }
            }
        });
        
        userInput.addEventListener('input', () => {
            const lineHeight = parseInt(window.getComputedStyle(userInput).lineHeight);
            const minHeight = 24;
            const twoLineHeight = lineHeight * 2;
            
            userInput.style.height = 'auto';
            const scrollHeight = userInput.scrollHeight;
            
            // اگر محتوا کمتر از 2 خط باشد، ارتفاع را 24 نگه دار
            if (scrollHeight <= twoLineHeight) {
                userInput.style.height = minHeight + 'px';
            } else {
                userInput.style.height = scrollHeight + 'px';
            }
            
            const maxHeight = parseInt(window.getComputedStyle(userInput).maxHeight);
            if (userInput.scrollHeight > maxHeight) {
                userInput.style.overflowY = 'auto';
            } else {
                userInput.style.overflowY = 'hidden';
            }
        });

        // Event listener برای visibility change
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && currentTypingData) {
                // وقتی به تب برمی‌گردیم، تایپ را ادامه می‌دهیم
                resumeTypingIfNeeded();
            }
        });

        // اسکرول chat-messages وقتی موس در خارج از آن است
        document.addEventListener('wheel', (event) => {
            const chatMessagesElement = document.getElementById('chat-messages');
            const rect = chatMessagesElement.getBoundingClientRect();
            const mouseX = event.clientX;
            const mouseY = event.clientY;
            
            // بررسی اینکه آیا موس در خارج از chat-messages است
            const isOutsideChat = mouseX < rect.left || mouseX > rect.right || 
                                 mouseY < rect.top || mouseY > rect.bottom;
            
            if (isOutsideChat && !event.ctrlKey && !event.metaKey) {
                // جلوگیری از اسکرول صفحه و اسکرول chat-messages به جای آن
                event.preventDefault();
                chatMessagesElement.scrollTop += event.deltaY;
            }
        }, { passive: false });

        // تابع بررسی وضعیت احراز هویت ادمین
        async function checkAdminAuth() {
            try {
                // بررسی session ادمین از طریق سرور
                const response = await fetch('/admin/check-auth', {
                    method: 'GET',
                    credentials: 'include' // برای ارسال session cookie
                });
                
                if (response.ok) {
                    // اگر درخواست موفق بود، یعنی ادمین لاگین کرده
                    quickTestButton.classList.add('show');
                    simulationTestButton.classList.add('show');
                } else if (response.status === 401) {
                    // اگر 401 بود، یعنی ادمین لاگین نکرده
                    quickTestButton.classList.remove('show');
                    simulationTestButton.classList.remove('show');
                } else {
                    // برای سایر خطاها، دکمه را مخفی کن
                    quickTestButton.classList.remove('show');
                    simulationTestButton.classList.remove('show');
                }
            } catch (error) {
                console.error('Error checking admin auth:', error);
                // در صورت خطا، دکمه را مخفی کن
                quickTestButton.classList.remove('show');
                simulationTestButton.classList.remove('show');
            }
        }

        // تابع تست خودکار
        async function startQuickTest() {
            // بررسی مجدد احراز هویت ادمین قبل از شروع تست
            try {
                const authResponse = await fetch('/admin/check-auth', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (!authResponse.ok) {
                    alert('شما دسترسی ادمین ندارید. لطفاً ابتدا وارد شوید.');
                    quickTestButton.classList.remove('show');
                    return;
                }
            } catch (error) {
                alert('خطا در بررسی دسترسی ادمین.');
                quickTestButton.classList.remove('show');
                return;
            }
            
            if (sendButton.disabled) {
                alert('لطفاً صبر کنید تا فرآیند قبلی تمام شود.');
                return;
            }

            // تأیید از کاربر
            if (!confirm('آیا می‌خواهید یک تست خودکار کامل اجرا کنید؟\n\nاین عملیات ممکن است 2-3 دقیقه طول بکشد و چت فعلی پاک خواهد شد.')) {
                return;
            }

            // فعال کردن حالت تست سریع (بدون انیمیشن تایپ)
            isQuickTestMode = true;

            // پاک کردن چت
            chatMessages.innerHTML = '';
            userId = 'web_user_' + Date.now() + Math.random().toString(36).substr(2, 9);

            // غیرفعال کردن دکمه‌ها
            quickTestButton.disabled = true;
            quickTestButton.textContent = '⏳ در حال اجرا...';
            sendButton.disabled = true;
            userInput.disabled = true;
            micButton.disabled = true;
            newChatButton.disabled = true;

            try {
                // نمایش پیام شروع تست
                addMessage('🤖 تست خودکار شروع شد...', 'bot');
                await new Promise(resolve => setTimeout(resolve, 500));

                // شروع تست real-time
                await startRealTimeTest();

            } catch (error) {
                console.error('Error in quick test:', error);
                removeTypingIndicator();
                addMessage(`❌ خطا در تست خودکار: ${error.message}`, 'bot');
            } finally {
                // فعال کردن مجدد دکمه‌ها
                quickTestButton.disabled = false;
                quickTestButton.textContent = '⚡ تست سریع';
                sendButton.disabled = false;
                userInput.disabled = false;
                micButton.disabled = false;
                newChatButton.disabled = false;
            }
        }

        // تابع تست real-time
        async function startRealTimeTest() {
            // پاک کردن پیام شروع
            chatMessages.innerHTML = '';

            // شروع مکالمه با پیام اول
            const firstMessage = "علی احمدی، 25 سال، مرد، کارشناس توسعه نرم‌افزار در یک شرکت استارتاپی، کارشناسی مهندسی کامپیوتر از دانشگاه تهران. الان تو شرکتم راضی هستم ولی می‌خوام ببینم چه مسیرهای دیگه‌ای می‌تونم برم.";
            
            // نمایش typing indicator برای کاربر
            showUserTypingIndicator();
            await new Promise(resolve => setTimeout(resolve, 400));
            removeUserTypingIndicator();
            
            // نمایش پیام اول کاربر
            addMessage(firstMessage, 'user');
            await new Promise(resolve => setTimeout(resolve, 300));

            // ارسال پیام اول و دریافت پاسخ
            try {
                showTypingIndicator();

                const response = await fetch(CHAT_API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_id: userId, 
                        message: firstMessage
                    }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                removeTypingIndicator();

                // نمایش پاسخ مشاور
                addTypedMessage(data.reply, 'bot');
                await new Promise(resolve => setTimeout(resolve, 1000));

                // ادامه مکالمه تا زمانی که تحلیل شروع بشه
                let conversationComplete = false;
                let messageCount = 0;
                const maxMessages = 15; // حداکثر تعداد پیام‌ها
                let currentBotResponse = data.reply; // ذخیره پاسخ فعلی مشاور

                while (!conversationComplete && messageCount < maxMessages) {
                    // تولید پیام بعدی بر اساس پاسخ مشاور
                    const nextMessage = await generateNextTestMessage(currentBotResponse);
                    
                    if (nextMessage) {
                        // نمایش typing indicator برای کاربر
                        showUserTypingIndicator();
                        await new Promise(resolve => setTimeout(resolve, 400));
                        removeUserTypingIndicator();
                        
                        // نمایش پیام کاربر
                        addMessage(nextMessage, 'user');
                        await new Promise(resolve => setTimeout(resolve, 300));

                        // ارسال پیام به سرور
                        showTypingIndicator();

                        const conversation = getCurrentConversation();
                        
                        const nextResponse = await fetch(CHAT_API_ENDPOINT, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                user_id: userId, 
                                message: nextMessage,
                                conversation: conversation
                            }),
                        });

                        if (!nextResponse.ok) {
                            throw new Error(`HTTP ${nextResponse.status}: ${nextResponse.statusText}`);
                        }

                        const nextData = await nextResponse.json();
                        removeTypingIndicator();

                        // *** تغییر: حذف بلاک if (analysis_started) ***
                        // نمایش پاسخ عادی
                        addTypedMessage(nextData.reply, 'bot');
                        await new Promise(resolve => setTimeout(resolve, 1000));
                        currentBotResponse = nextData.reply; // بروزرسانی پاسخ مشاور

                        messageCount++;
                    } else {
                        // اگر پیام بعدی تولید نشد، مکالمه رو تمام کن
                        conversationComplete = true;
                    }
                }

                // *** حذف شد: بلاک if (!conversationComplete) ***
                // دیگر نیازی به اجرای دستی تحلیل نیست

            } catch (error) {
                console.error('Error in real-time test:', error);
                removeTypingIndicator();
                addMessage('❌ خطا در ارتباط با سرور', 'bot');
            }

            // نمایش پیام موفقیت
            await new Promise(resolve => setTimeout(resolve, 1500));
            addMessage('✅ تست خودکار (بدون تحلیل نهایی) با موفقیت به پایان رسید!', 'bot');
            
            // غیرفعال کردن حالت تست سریع
            isQuickTestMode = false;
        }

        // تابع تولید پیام بعدی بر اساس پاسخ مشاور
        async function generateNextTestMessage(botResponse) {
            try {
                // استفاده از هوش مصنوعی برای تولید پاسخ واقعی
                const conversation = getCurrentConversation();
                
                // ایجاد پرامپت برای تولید پاسخ کاربر
                const userPrompt = `شما نقش یک کاربر واقعی را بازی می‌کنید که با مشاور شغلی صحبت می‌کند. بر اساس مکالمه قبلی و پاسخ مشاور، یک پاسخ طبیعی و واقعی بدهید.

مشاور گفت: "${botResponse}"

لطفاً یک پاسخ کوتاه و طبیعی بدهید که:
1. به سوال مشاور پاسخ دهد
2. اطلاعات مفیدی درباره خودتان ارائه دهد
3. طبیعی و واقعی به نظر برسد
4. حداکثر 2-3 جمله باشد

فقط پاسخ را بنویسید، بدون توضیح اضافی:`;

                const response = await fetch(CHAT_API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_id: userId + '_test_user', // استفاده از user_id متفاوت برای تست
                        message: userPrompt,
                        conversation: conversation
                    }),
                });

                if (response.ok) {
                    const data = await response.json();
                    return data.reply || null;
                }
            } catch (error) {
                console.error('Error generating test message:', error);
            }

            // fallback: اگر هوش مصنوعی کار نکرد، از پاسخ‌های از پیش تعریف شده استفاده کن
            const fallbackResponses = [
                "تو دوران نوجوونی خیلی ایلان ماسک رو دوست داشتم. جذابیتش برام این بود که یه آدم واقعی بود که با تکنولوژی داشت دنیا رو تغییر می‌داد.",
                "معمولاً ویدیوهای مربوط به تکنولوژی جدید، هوش مصنوعی، و استارتاپ‌ها میاد برام.",
                "فیلم The Social Network خیلی برام جذاب بود. این که چطور یه ایده ساده تبدیل به یه پلتفرم جهانی شد.",
                "همیشه یاد بگیر، هرگز تسلیم نشو. تجربه‌هام بهم یاد داده که وقتی می‌خوای چیز جدیدی یاد بگیری، اولش سخته.",
                "یادمه وقتی 5 سالم بود، پدرم یه کامپیوتر قدیمی آورد خونه. خیلی کنجکاو بودم که این چیز چطوری کار می‌کنه.",
                "آخرین پروژه تیمی که داشتم، توسعه یه API برای یه اپلیکیشن موبایل بود. تو تیم 4 نفره بودیم.",
                "یه بار deadline یه پروژه خیلی نزدیک بود و یهو متوجه شدیم یه bug بزرگ تو production هست.",
                "بیشتر به سمت استارتاپ با آزادی عمل بالا کشیده میشم. چون دوست دارم خودم تصمیم بگیرم.",
                "پروژه‌ای که خیلی ازش لذت بردم، ساخت یه ابزار automation برای خودم بود."
            ];

            // اگر مشاور سوال پرسیده، پاسخ مناسب بده
            if (botResponse.includes('؟') || botResponse.includes('چطور') || botResponse.includes('کدوم')) {
                return fallbackResponses[Math.floor(Math.random() * fallbackResponses.length)];
            }

            // اگر مشاور درخواست اطلاعات بیشتری کرده، اطلاعات بیشتری بده
            if (botResponse.includes('بیشتر') || botResponse.includes('توضیح') || botResponse.includes('درباره')) {
                return fallbackResponses[Math.floor(Math.random() * fallbackResponses.length)];
            }

            // *** تغییر: حذف شد: دیگر به تحلیل اشاره نمی‌کنیم ***
            // if (botResponse.includes('تحلیل') || botResponse.includes('گزارش') || botResponse.includes('بررسی')) {
            //     return "بله، ممنون. تحلیل کن.";
            // }

            // در غیر این صورت، پاسخ تصادفی بده
            return fallbackResponses[Math.floor(Math.random() * fallbackResponses.length)];
        }

        // Event listener برای دکمه تست سریع
        quickTestButton.addEventListener('click', startQuickTest);

        // تابع تست شبیه‌سازی پیشرفته
        async function startSimulationTest() {
            // بررسی مجدد احراز هویت ادمین قبل از شروع تست
            try {
                const authResponse = await fetch('/admin/check-auth', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (!authResponse.ok) {
                    alert('شما دسترسی ادمین ندارید. لطفاً ابتدا وارد شوید.');
                    simulationTestButton.classList.remove('show');
                    return;
                }
            } catch (error) {
                alert('خطا در بررسی دسترسی ادمین.');
                simulationTestButton.classList.remove('show');
                return;
            }
            
            if (sendButton.disabled) {
                alert('لطفاً صبر کنید تا فرآیند قبلی تمام شود.');
                return;
            }

            // انتخاب حالت تست
            const mode = confirm('آیا می‌خواهید پرسونای هدایت‌شده استفاده کنید؟\n\nبله = هدایت‌شده (شما دستورالعمل می‌دهید)\nخیر = تصادفی (سیستم خودش انتخاب می‌کند)') ? 'guided' : 'random';
            
            let instructions = '';
            if (mode === 'guided') {
                instructions = prompt('دستورالعمل پرسونا را وارد کنید:\n\nمثال: یک مهندس نرم‌افزار ۴۰ ساله که از کارش راضیه ولی میخواد سراغ مدیریت بره...');
                if (!instructions) {
                    alert('دستورالعمل الزامی است.');
                    return;
                }
            }

            // تأیید از کاربر
            if (!confirm('آیا می‌خواهید یک تست شبیه‌سازی پیشرفته اجرا کنید؟\n\nاین عملیات ممکن است 2-3 دقیقه طول بکشد و چت فعلی پاک خواهد شد.')) {
                return;
            }

            // فعال کردن حالت تست سریع (بدون انیمیشن تایپ)
            isQuickTestMode = true;

            // پاک کردن چت
            chatMessages.innerHTML = '';
            userId = 'web_user_' + Date.now() + Math.random().toString(36).substr(2, 9);

            // غیرفعال کردن دکمه‌ها
            simulationTestButton.disabled = true;
            simulationTestButton.textContent = '⏳ در حال اجرا...';
            sendButton.disabled = true;
            userInput.disabled = true;
            micButton.disabled = true;
            newChatButton.disabled = true;

            try {
                // نمایش پیام شروع تست
                addMessage('🤖 تست شبیه‌سازی پیشرفته شروع شد...', 'bot');
                await new Promise(resolve => setTimeout(resolve, 500));

                // شروع تست real-time شبیه‌سازی
                await startRealTimeSimulationTest(mode, instructions);

            } catch (error) {
                console.error('Error in simulation test:', error);
                removeTypingIndicator();
                addMessage(`❌ خطا در تست شبیه‌سازی: ${error.message}`, 'bot');
            } finally {
                // فعال کردن مجدد دکمه‌ها
                simulationTestButton.disabled = false;
                simulationTestButton.textContent = '🧪 تست شبیه‌سازی';
                sendButton.disabled = false;
                userInput.disabled = false;
                micButton.disabled = false;
                newChatButton.disabled = false;
                
                // غیرفعال کردن حالت تست سریع
                isQuickTestMode = false;
            }
        }

        // تابع تست real-time شبیه‌سازی
        async function startRealTimeSimulationTest(mode, instructions) {
            // پاک کردن پیام شروع
            chatMessages.innerHTML = '';
            addMessage(`🤖 تست شبیه‌سازی پیشرفته (حالت: ${mode}) شروع شد... در حال اجرا در سرور.`, 'bot');
            showTypingIndicator(); // نمایش نشانگر "در حال کار"

            try {
                // 1. فراخوانی اندپوینت صحیح در بک‌اند
                const response = await fetch('/admin/advanced-test', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        // ارسال کوکی‌های session برای احراز هویت ادمین
                        'Credentials': 'include'
                    },
                    body: JSON.stringify({ 
                        mode: mode, 
                        instructions: instructions 
                    }),
                });

                removeTypingIndicator();

                if (!response.ok) {
                    // بررسی خطای 401 (عدم احراز هویت)
                    if (response.status === 401) {
                         throw new Error('خطای احراز هویت. لطفاً دوباره وارد پنل ادمین شوید.');
                    }
                    const errorData = await response.json();
                    throw new Error(errorData.error || `خطای سرور: ${response.status}`);
                }

                const data = await response.json();

                if (data.success) {
                    // 2. نمایش نتایج کامل دریافت شده از سرور
                    
                    // نمایش پرسونای تولید شده
                    addMessage(`👤 پرسونای شبیه‌سازی شده:\n${data.persona_details}`, 'bot');
                    await new Promise(resolve => setTimeout(resolve, 500));

                    // نمایش لاگ کامل مکالمه
                    if (data.conversation && Array.isArray(data.conversation)) {
                        for (const msg of data.conversation) {
                            addMessage(msg.message, msg.role);
                            // افزودن یک تاخیر کوتاه برای نمایش بهتر
                            await new Promise(resolve => setTimeout(resolve, 300));
                        }
                    }
                    
                    // 3. نمایش گزارش نهایی
                    if (data.final_report) {
                         addMessage(`--- گزارش نهایی شبیه‌سازی ---\n${data.final_report}`, 'bot');
                    }
                    
                    addMessage('✅ تست شبیه‌سازی پیشرفته با موفقیت به پایان رسید!', 'bot');
                    
                } else {
                    throw new Error(data.error || 'تست شبیه‌سازی در سرور ناموفق بود.');
                }

            } catch (error) {
                console.error('Error in real-time simulation test:', error);
                removeTypingIndicator();
                addMessage(`❌ خطا در تست شبیه‌سازی: ${error.message}`, 'bot');
            }
        }


        // Event listener برای دکمه تست شبیه‌سازی
        simulationTestButton.addEventListener('click', startSimulationTest);

        window.addEventListener('load', async () => {
            loadTheme();
            await checkAdminAuth(); // بررسی وضعیت ادمین
            showTypingIndicator();
            setTimeout(() => { removeTypingIndicator(); addTypedMessage('سلام! من مشاور شغلی «هزارجاب» هستم. برای اینکه بتونم بهتر کمکت کنم، لطفاً خودت رو کامل معرفی کن: نام، سن، جنسیت، وضعیت شغلی فعلی و رشتهٔ تحصیلی.', 'bot'); }, 1000);
        });
    </script>
